[project]
name = "multi-agent-sync-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.2",
    "matplotlib>=3.11.1",
    "packaging>=26.2",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
vllm-server = [
    "vllm-server-launcher @ git+ssh://git@github.com/machinelearningnuremberg/vllm-server.git@dev-server-suman",
]
# LTS baselines (third_party/autogen-lts submodule); see README "LTS Baselines".
lts = [
    "autogen-core",
    "autogen-agentchat",
    "autogen-ext[openai,magentic-one]",
    "huggingface-hub",
    "peft",
    "pyyaml",
    "tiktoken",
    "torch",
    "transformers",
]

[project.scripts]
evaluation = "multi_agent_sync.evaluation.main:main"
generate-experiments = "multi_agent_sync.generate:main"
multi-agent-sync = "multi_agent_sync.main:main"

[tool.uv.sources]
autogen-core = { path = "third_party/autogen-lts/python/packages/autogen-core", editable = true }
autogen-agentchat = { path = "third_party/autogen-lts/python/packages/autogen-agentchat", editable = true }
autogen-ext = { path = "third_party/autogen-lts/python/packages/autogen-ext", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_sync"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
