[project]
name = "multi-agent-sync-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.2",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
    "tqdm>=4.68.3",
]

[project.scripts]
evaluation = "multi_agent_sync.evaluation.main:main"
multi-agent-sync = "multi_agent_sync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_sync"]

[tool.pytest.ini_options]
pythonpath = ["src"]
