                <p>
                  <span class="pill">critical debate: ${esc(Boolean(agent.critical_debate))}</span>
                  <span class="pill">workspace: ${esc(agent.workspace_access || 'none')}</span>
                </p>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function renderDynamicOrchestrationPlan(trace) {
      const plan = Array.isArray(trace.workflow_plan) ? trace.workflow_plan : [];
      if (!plan.length) {
        return '<div class="empty">No workflow plan was recorded for this dynamic orchestration run.</div>';
      }
      return `
        <details class="mini-panel" open>
          <summary>Workflow plan</summary>
          <div class="grid">
            ${plan.map((step, index) => `
              <div class="mini-panel">
                <strong>Step ${esc(index + 1)} · ${esc(step.step_id || '')}</strong>
                <p>
                  <span class="pill">status: ${esc(step.status || '')}</span>
                </p>
                ${step.objective ? `<div><strong>Objective</strong><br>${esc(step.objective)}</div>` : ''}
                ${step.completion_criteria ? `<div><strong>Completion criteria</strong><br>${esc(step.completion_criteria)}</div>` : ''}
                ${step.result ? `<div><strong>Result</strong><br>${esc(step.result)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function renderDynamicOrchestrationRound(round) {
      const decision = round.decision && typeof round.decision === 'object' ? round.decision : {};
      const stepAssignments = Array.isArray(round.step_assignments) ? round.step_assignments : [];
      const aggregation = round.candidate_aggregation || round.candidate_aggregation_before || {};
      const reportingAgents = Array.isArray(round.reporting_agents)
        ? round.reporting_agents
        : (Array.isArray(aggregation.reporting_agents) ? aggregation.reporting_agents : []);
      const supportingAgents = Array.isArray(round.supporting_agents)
        ? round.supporting_agents
        : (Array.isArray(aggregation.supporting_agents) ? aggregation.supporting_agents : []);
      return `
        <details class="mini-panel" open>
          <summary>Round ${esc(round.round ?? '')} · ${esc(decision.action || 'unknown')}</summary>
          <p>
            <span class="pill">action: ${esc(decision.action || '')}</span>
            <span class="pill">tokens: ${esc(formatTokenUsage(round.token_usage))}</span>
            <span class="pill">rule: ${esc(aggregation.selection_rule || '')}</span>
            <span class="pill">strength: ${esc(aggregation.consensus_strength || '')}</span>
          </p>
          <h4>Reason</h4>
          <pre>${esc(decision.reason || '')}</pre>
          ${renderDynamicOrchestrationStepUsage(round)}
          ${decision.round_goal ? `<h4>Round goal</h4><pre>${esc(decision.round_goal)}</pre>` : ''}
          ${decision.final_answer ? `<h4>Round final answer</h4><pre>${esc(decision.final_answer)}</pre>` : ''}
          <h4>Step assignments</h4>
          ${stepAssignments.map((assignment) => `
            <div class="mini-panel">
              <strong>${esc(assignment.agent_name || assignment.name || '')}</strong>
              <p>
                <span class="pill">report_policy: ${esc(assignment.report_policy || 'report')}</span>
                <span class="pill">workspace: ${esc(assignment.workspace_access || 'none')}</span>
              </p>
              ${assignment.subtask ? `<div><strong>Subtask</strong><br>${esc(assignment.subtask)}</div>` : ''}
              ${assignment.expected_output ? `<div><strong>Expected output</strong><br>${esc(assignment.expected_output)}</div>` : ''}
            </div>
          `).join('') || '<p class="subtle">No step assignments in this round.</p>'}
          ${renderDynamicOrchestrationReportRows('Reporting agents', reportingAgents)}
          ${renderDynamicOrchestrationReportRows('Support-only agents', supportingAgents)}
          <details><summary>Candidate aggregation</summary><pre>${esc(pretty(aggregation))}</pre></details>
          <details><summary>Raw controller prompt</summary><pre>${esc(round.prompt || '')}</pre></details>
          <details><summary>Raw controller output</summary><pre>${esc(round.raw_response || '')}</pre></details>
          <details><summary>Round agent outputs</summary><pre>${esc(pretty(round.agent_outputs || {}))}</pre></details>
        </details>
      `;
    }

    function renderDynamicOrchestrationReportRows(title, rows) {
      if (!Array.isArray(rows) || !rows.length) {
        return `<p class="subtle">${esc(title)}: none</p>`;
      }
      return `
        <details class="mini-panel" open>
          <summary>${esc(title)}</summary>
          <div class="grid">
            ${rows.map((row) => `
              <div class="mini-panel">
                <strong>${esc(row.agent_name || row.logical_agent_name || '')}</strong>
                <p>
                  <span class="pill">policy: ${esc(row.report_policy || '')}</span>
                  <span class="pill">report: ${esc(row.reports_to_orchestrator ?? '')}</span>
                  ${row.candidate !== undefined && row.candidate !== null ? `<span class="pill">candidate: ${esc(row.candidate)}</span>` : ''}
                </p>
                ${row.support_excerpt ? `<div><strong>Contribution</strong><br>${esc(row.support_excerpt)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function renderDynamicOrchestrationStepUsage(round) {
      const step = round.current_step && typeof round.current_step === 'object' ? round.current_step : {};
      const assignments = Array.isArray(round.assignments) ? round.assignments : [];
      const stepAssignments = Array.isArray(round.step_assignments) ? round.step_assignments : [];
      const agentNames = assignments.length
        ? assignments.map((assignment) => assignment.agent_name || assignment.name).filter(Boolean)
        : stepAssignments.map((assignment) => assignment.agent_name || assignment.name).filter(Boolean);
      if (!Object.keys(step).length && !round.step_result && !agentNames.length) return '';
      return `
        <div class="mini-panel">
          <h4>Current step</h4>
          <p>
            ${step.step_id ? `<span class="pill">${esc(step.step_id)}</span>` : ''}
            ${step.status ? `<span class="pill">status: ${esc(step.status)}</span>` : ''}
          </p>
          ${step.objective ? `<div><strong>Objective</strong><br>${esc(step.objective)}</div>` : ''}
          ${step.completion_criteria ? `<div><strong>Completion criteria</strong><br>${esc(step.completion_criteria)}</div>` : ''}
          ${round.step_result ? `<div><strong>Step result</strong><br>${esc(round.step_result)}</div>` : ''}
          ${agentNames.length ? `<div><strong>Subagents used for this step</strong><br>${agentNames.map((name) => `<span class="pill">${esc(name)}</span>`).join(' ')}</div>` : ''}
        </div>
      `;
    }

    function renderOutput(example) {
      return `<pre>${esc(example.raw_output)}</pre>`;
    }

    function renderSummarizer(example) {
      const summarizer = example.summarizer;
      if (!summarizer) {
        return '<div class="empty">No summarizer trace data for this example.</div>';
      }
      const step = (summarizer.steps || [])[0] || {};
      return `
        <div class="grid">
          <div>
            <h3>Decision</h3>
            <p>
              <span class="pill">method_trace.synthesizer_trace</span>
              <span class="pill">mode: ${esc(summarizer.assignment?.mode || '')}</span>
              <span class="pill ${summarizer.assignment?.timed_out ? 'warn' : 'good'}">timed out: ${esc(Boolean(summarizer.assignment?.timed_out))}</span>
            </p>
            <div class="subtle">Token usage: ${esc(formatTokenUsage(step.token_usage))}</div>
          </div>
          <div>
            <h3>Final answer</h3>
            <pre>${esc(summarizer.final_output || '')}</pre>
          </div>
        </div>
        <details open><summary>Raw summarizer prompt</summary><pre>${esc(step.prompt || '')}</pre></details>
        <details open><summary>Raw summarizer output</summary><pre>${esc(step.raw_response || '')}</pre></details>
        <details><summary>Parsed summarizer trace</summary><pre>${esc(pretty(step.parsed_output || {}))}</pre></details>
      `;
    }

    function renderAgents(example) {
      const agents = (example.agents || []).filter((agent) => state.agent === 'all' || agent.name === state.agent);
      const agentBlocks = agents.map((agent) => `
        <div class="agent">
          <h3>${esc(agent.name)}</h3>
          <details><summary>Assignment</summary><pre>${esc(pretty(agent.assignment))}</pre></details>
          ${(agent.steps || []).map((step) => `
            <div class="step">
              <strong>Step ${esc(step.step)} ${step.is_reactive ? '<span class="pill warn">reactive</span>' : ''}</strong>
              <div class="subtle">Token usage: ${esc(formatTokenUsage(step.token_usage))}</div>
              <details ${step.open_prompt ? 'open' : ''}><summary>Prompt</summary><pre>${esc(step.prompt)}</pre></details>
              ${step.parsed_output?.output ? `<details open><summary>Output</summary><pre>${esc(step.parsed_output.output)}</pre></details>` : ''}
              <details open><summary>Response</summary><pre>${esc(step.raw_response)}</pre></details>
              <details><summary>Parsed output</summary><pre>${esc(pretty(step.parsed_output))}</pre></details>
              <details><summary>Inbox and published events</summary><pre>${esc(pretty({ inbox_events: step.inbox_events, published_events: step.published_events, used_event_ids: step.used_event_ids }))}</pre></details>
            </div>
          `).join('') || '<p class="subtle">No steps.</p>'}
          <details><summary>Final output</summary><pre>${esc(agent.final_output)}</pre></details>
          <details><summary>Event receipts</summary><pre>${esc(pretty(agent.event_receipts))}</pre></details>
        </div>
      `).join('') || '<div class="empty">No agent trace data.</div>';
      return `${renderAgentFilter(example)}${agentBlocks}`;
    }

    function renderEvents(example) {
      const receiptsForMatching = example.receipts || [];
      const events = (example.events || [])
        .filter((event) => eventMatchesAgent(event, receiptsForMatching))
        .filter(eventMatchesType);
      const renderedEvents = events.map((event) => renderEventFlow(event, receiptsForMatching.filter(receiptMatchesType))).join('') || '<div class="empty">No event log matches this filter.</div>';
      const receipts = receiptsForMatching
        .filter((receipt) => state.eventAgent === 'all' || receipt.agent_name === state.eventAgent || receipt.source === state.eventAgent)
        .filter(receiptMatchesType);
      return `${renderEventAgentFilter(example)}${renderEventTypeFilter(example)}<p class="subtle">Showing ${events.length} of ${(example.events || []).length} events.</p>${renderedEvents}<h3>Receipts</h3><pre>${esc(pretty(receipts))}</pre>`;
    }

    function eventMatchesAgent(event, receipts) {
      if (state.eventAgent === 'all') return true;
      return event.source === state.eventAgent ||
        event.target === state.eventAgent ||
        receipts.some((receipt) => receipt.event_id === event.event_id && receipt.agent_name === state.eventAgent);
    }

    function eventMatchesType(event) {
      return eventTypeIsVisible(event.event_type);
    }

    function receiptMatchesType(receipt) {
      return eventTypeIsVisible(receipt.event_type);
    }

    function eventTypeIsVisible(eventType) {
      if (state.eventType === 'all') return true;
      if (state.eventType === 'communication') return COMMUNICATION_EVENT_TYPES.includes(eventType);
      if (state.eventType === 'lifecycle') return LIFECYCLE_EVENT_TYPES.includes(eventType);
      if (state.eventType === 'agent_done') return eventType === 'agent_done';
      if (state.eventType === 'message_received') return eventType === 'message_received';
      if (state.eventType.startsWith('type:')) return eventType === state.eventType.slice(5);
      return COMMUNICATION_EVENT_TYPES.includes(eventType);
    }

    function renderEventFlow(event, receipts) {
      const eventReceipts = receipts.filter((receipt) => receipt.event_id === event.event_id);
      const typeClass = ['finding', 'critique', 'warning'].includes(event.event_type) ? event.event_type : '';
      const receivedBy = eventReceipts.length
        ? eventReceipts.map((receipt) => `
            <span class="pill ${receipt.accepted ? 'good' : 'bad'}">
              ${esc(receipt.agent_name)} ${receipt.accepted ? 'accepted' : `ignored: ${receipt.ignored_reason || 'no reason'}`}
              ${receipt.used_in_step ? ` · used step ${esc(receipt.used_in_step)}` : ''}
            </span>
          `).join('')
        : '<span class="pill">no receipts recorded</span>';
      return `
        <div class="event ${typeClass}">
          <div class="flow">
            <span class="pill ${typeClass === 'finding' ? 'good' : typeClass === 'warning' ? 'bad' : typeClass === 'critique' ? 'warn' : ''}">${esc(event.event_type)}</span>
            <strong>${esc(event.source)}</strong>
            <span class="flow-arrow">-></span>
            <strong>${esc(event.target)}</strong>
          </div>
          <div class="flow">${receivedBy}</div>
          <pre>${esc(event.content)}</pre>
        </div>
      `;
    }

    function renderTools(example) {
      const tools = [];
      (example.agents || []).forEach((agent) => {
        (agent.tools || []).forEach((tool) => tools.push({ agent: agent.name, step: 'final', ...tool }));
        (agent.steps || []).forEach((step) => (step.tools || []).forEach((tool) => tools.push({ agent: agent.name, step: step.step, ...tool })));
      });
      (example.events || []).forEach((event) => (event.tools || []).forEach((tool) => tools.push({ agent: event.source, step: 'event', ...tool })));
      return tools.map((tool) => `
        <div class="event">
          <span class="pill">${esc(tool.agent)}</span>
          <span class="pill">step ${esc(tool.step)}</span>
          <span class="pill">${esc(tool.tool)}</span>
          <pre>${esc(tool.command || tool.raw)}</pre>
        </div>
      `).join('') || '<div class="empty">No ACTION tool calls detected in this trace.</div>';
    }

    function renderRaw(example) {
      return `<pre>${esc(example.raw_trace_excerpt)}</pre>`;
    }

    $('loadDefaultButton').addEventListener('click', loadDefaultOutputFolder);
    $('openFolderButton').addEventListener('click', openOutputFolder);
    $('rescanButton').addEventListener('click', rescanCurrentFolder);
    $('folderInput').addEventListener('change', (event) => loadFromFileInput(event.target.files));
    $('benchmarkFilter').addEventListener('change', (event) => { state.benchmark = event.target.value; state.model = 'all'; state.method = 'all'; state.run = 'all'; state.exampleIndex = 0; state.agent = 'all'; state.eventAgent = 'all'; state.eventType = 'communication'; render(); });
    $('modelFilter').addEventListener('change', (event) => { state.model = event.target.value; state.method = 'all'; state.run = 'all'; state.exampleIndex = 0; state.agent = 'all'; state.eventAgent = 'all'; state.eventType = 'communication'; render(); });
    $('methodFilter').addEventListener('change', (event) => { state.method = event.target.value; state.run = 'all'; state.exampleIndex = 0; state.agent = 'all'; state.eventAgent = 'all'; state.eventType = 'communication'; render(); });
    $('runFilter').addEventListener('change', (event) => { state.run = event.target.value; state.exampleIndex = 0; state.agent = 'all'; state.eventAgent = 'all'; state.eventType = 'communication'; render(); });
    $('searchFilter').addEventListener('input', (event) => { state.search = event.target.value; render(); });
    $('exampleFilter').addEventListener('change', (event) => { state.exampleIndex = Number(event.target.value || 0); state.agent = 'all'; state.eventAgent = 'all'; state.eventType = 'communication'; render(); });

    configureProtocolMode();
    render();
    if (!isFileProtocol()) loadDefaultOutputFolder();
    if (isFileProtocol()) {
      $('sourceStatus').textContent = 'Browser blocks automatic default loading for file:// pages. Click Open output folder and select the output folder.';
    }
  </script>
</body>
</html>
