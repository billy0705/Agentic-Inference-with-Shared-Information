<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Output Viewer</title>
  <style>
    :root {
      --bg: #f6f6f1;
      --panel: #ffffff;
      --ink: #1f241f;
      --muted: #687067;
      --line: #d8ddd3;
      --accent: #0f766e;
      --accent-soft: #ddf3ee;
      --bad: #b42318;
      --good: #067647;
      --warn: #b54708;
      --code: #f0f2ed;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 100vh; }
    aside { background: #fbfbf7; border-right: 1px solid var(--line); padding: 18px; height: 100vh; overflow: auto; position: sticky; top: 0; }
    main { padding: 22px; min-width: 0; }
    h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; letter-spacing: 0; }
    h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: 0; }
    .subtle { color: var(--muted); font-size: 13px; }
    .controls { display: grid; gap: 10px; margin: 16px 0; }
    .primary { border: 1px solid var(--accent); background: var(--accent); color: white; border-radius: 6px; padding: 10px 12px; font-weight: 700; }
    .secondary { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 6px; padding: 8px 10px; }
    .field { display: grid; gap: 6px; margin: 12px 0; }
    label { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    select, input[type="search"] { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); padding: 9px 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    .stat { padding: 14px; }
    .stat strong { display: block; font-size: 20px; }
    .panel { padding: 16px; margin-bottom: 16px; min-width: 0; }
    .run-list { display: grid; gap: 8px; margin-top: 14px; }
    .run-button { width: 100%; text-align: left; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 10px; }
    .run-button.active { border-color: var(--accent); background: var(--accent-soft); }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin: 12px 0; overflow: auto; }
    .tab { border: 0; background: transparent; color: var(--muted); padding: 10px 4px; white-space: nowrap; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .page-tabs { display: flex; gap: 8px; margin: 0 0 16px; }
    .page-tab { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 6px; padding: 9px 12px; }
    .page-tab.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 800; }
    .pill { display: inline-flex; align-items: center; border: 1px solid var(--line); background: white; border-radius: 999px; min-height: 22px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .agent { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: white; margin-bottom: 12px; }
    .step { border-left: 3px solid var(--accent); padding-left: 12px; margin: 12px 0; }
    .event { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .event:last-child { border-bottom: 0; }
    .event.finding { border-left: 4px solid var(--good); padding-left: 10px; background: #f5fbf7; }
    .event.critique { border-left: 4px solid var(--warn); padding-left: 10px; background: #fff8ed; }
    .event.warning { border-left: 4px solid var(--bad); padding-left: 10px; background: #fff5f5; }
    .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
    .flow-arrow { color: var(--muted); font-family: var(--mono); }
    .mini-panel { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; margin: 8px 0; }
    .benchmark-block { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 14px; margin: 14px 0; }
    .benchmark-methods { display: grid; gap: 8px; margin-top: 12px; }
    .method-row { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(180px, 2fr) minmax(72px, auto) minmax(112px, auto) minmax(86px, auto) minmax(100px, auto) minmax(80px, auto); gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
    .route-breakdown { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .analysis-summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; margin: 12px 0; }
    .analysis-controls { display: grid; grid-template-columns: repeat(3, minmax(160px, 1fr)); gap: 10px; align-items: end; }
    .analysis-baselines { grid-column: 1 / -1; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: white; border-radius: 999px; min-height: 28px; padding: 4px 10px; font-size: 12px; font-weight: 800; text-transform: none; color: var(--ink); }
    .check-pill input { width: auto; margin: 0; }
    .analysis-bucket { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 12px; margin: 12px 0; }
    .analysis-list { display: grid; gap: 8px; margin-top: 10px; }
    .analysis-row { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 10px; }
    .analysis-row-header { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .analysis-row-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .analysis-jump { border: 1px solid var(--accent); color: var(--accent); background: white; border-radius: 6px; padding: 5px 8px; font-size: 12px; font-weight: 800; }
    .analysis-chart { display: grid; gap: 8px; margin: 10px 0; }
    .shared-finding-text { max-width: 520px; }
    .chart-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(160px, 3fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
    .chart-track { height: 14px; border-radius: 999px; background: var(--code); border: 1px solid var(--line); overflow: hidden; }
    .chart-fill { height: 100%; background: var(--accent); }
    .round-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .round-table th, .round-table td { border-bottom: 1px solid var(--line); padding: 7px; text-align: left; vertical-align: top; }
    .round-table th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .metric-label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .source-chip { display: inline-flex; align-items: center; max-width: 100%; border: 1px solid var(--line); border-radius: 999px; background: white; padding: 2px 8px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .source-chip.current { color: var(--good); background: #f5fbf7; }
    .source-chip.reused { color: var(--accent); background: var(--accent-soft); }
    .accuracy-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .accuracy-table th, .accuracy-table td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: middle; }
    .accuracy-table th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .matrix-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .invalid-locations { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 12px; }
    .invalid-location { border: 1px solid var(--line); border-radius: 6px; background: #fff8ed; color: var(--warn); padding: 5px 8px; font-size: 12px; font-weight: 700; }
    .question-matrix { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 12px; }
    .question-matrix th, .question-matrix td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
    .question-matrix th:last-child, .question-matrix td:last-child { border-right: 0; }
    .question-matrix th { color: var(--muted); font-size: 11px; text-transform: uppercase; background: #fbfbf7; position: sticky; top: 0; z-index: 1; }
    .question-matrix tr:last-child td { border-bottom: 0; }
    .result-cell { width: 100%; text-align: left; border: 1px solid var(--line); background: white; border-radius: 6px; padding: 7px; min-height: 58px; }
    .result-cell.compact { min-height: 0; padding: 5px 7px; text-align: center; }
    .result-cell.active { border-color: var(--accent); background: var(--accent-soft); }
    .result-cell .status { display: block; font-weight: 800; }
    .result-cell.correct .status { color: var(--good); }
    .result-cell.wrong .status, .result-cell.error .status { color: var(--bad); }
    .result-cell.invalid .status { color: var(--warn); }
    .result-meta { display: block; color: var(--muted); margin-top: 4px; word-break: break-word; }
    .example-status-correct { color: var(--good); }
    .example-status-wrong { color: var(--bad); }
    .bar-cell { min-width: 180px; }
    .bar-track { height: 12px; border-radius: 999px; background: var(--code); border: 1px solid var(--line); overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); }
    pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.45; border: 1px solid var(--line); background: var(--code); border-radius: 8px; padding: 12px; max-height: 560px; overflow: auto; }
    summary { cursor: pointer; color: var(--accent); font-weight: 700; margin-top: 8px; }
    .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 24px; color: var(--muted); text-align: center; }
    .hidden { display: none; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { height: auto; position: static; }
      .stats, .grid, .analysis-summary { grid-template-columns: 1fr; }
      .method-row { grid-template-columns: 1fr; }
      .analysis-controls, .chart-row { grid-template-columns: 1fr; }
      .page-tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Output Viewer</h1>
      <div class="subtle" id="sourceStatus">No output folder loaded.</div>
      <div class="controls">
        <button class="secondary" id="loadDefaultButton" type="button">Load default ../output</button>
        <button class="primary" id="openFolderButton" type="button">Open output folder</button>
        <button class="secondary" id="rescanButton" type="button" disabled>Rescan current folder</button>
        <input class="hidden" id="folderInput" type="file" webkitdirectory multiple>
      </div>
      <div class="field"><label for="benchmarkFilter">Benchmark</label><select id="benchmarkFilter"></select></div>
      <div class="field"><label for="modelFilter">Model</label><select id="modelFilter"></select></div>
      <div class="field"><label for="methodFilter">Method</label><select id="methodFilter"></select></div>
      <div class="field"><label for="runFilter">Run</label><select id="runFilter"></select></div>
      <div class="field"><label for="searchFilter">Search</label><input id="searchFilter" type="search" placeholder="agent, event, error, prompt"></div>
      <div class="run-list" id="runList"></div>
    </aside>
    <main>
      <div class="stats" id="stats"></div>
      <div class="page-tabs" id="pageTabs"></div>
      <section class="panel" id="accuracyPanel"><div class="empty">Open output data to compare benchmark accuracy.</div></section>
      <section class="panel" id="analysisPanel"><div class="empty">Open output data to analyze a single run.</div></section>
      <div id="detailPage">
        <section class="panel" id="runPanel"><div class="empty">Open the repository's output folder to begin.</div></section>
        <section class="panel">
          <div class="toolbar">
            <h2>Example Detail</h2>
            <div class="toolbar">
              <select id="exampleFilter"></select>
            </div>
          </div>
          <div class="tabs" id="tabs"></div>
          <div id="tabContent"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_OUTPUT_ROOT = '../output/';
    const TEXT_LIMIT = 300000;
    const COMMUNICATION_EVENT_TYPES = ['finding', 'critique', 'warning', 'question'];
    const LIFECYCLE_EVENT_TYPES = ['task_started', 'plan_created', 'agent_started', 'final_summary'];
    const BASELINE_METHOD_DEFAULTS = ['single_agent', 'majority_vote', 'multiagent_debate'];
    const MAX_ANALYSIS_ROUNDS = 3;
    const state = {
      files: [],
      skippedFiles: [],
      folderHandle: null,
      loadingExampleKey: '',
      data: { runs: [], benchmarks: [] },
      benchmark: 'all',
      model: 'all',
      method: 'all',
      run: 'all',
      exampleIndex: 0,
      agent: 'all',
      eventAgent: 'all',
      eventType: 'communication',
      accuracyModels: {},
      analysisBenchmark: '',
      analysisModels: {},
      analysisRuns: {},
      analysisMethod: 'multiagent_dynamic_streaming',
      analysisBaselineMethods: [],
      analysisRoundMetric: 'correct_majority',
      analysisTraceLoadingKey: '',
      analysisTraceLoadProgress: null,
      page: 'accuracy',
      tab: 'Overview',
      search: '',
    };

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const pretty = (value) => typeof value === 'string' ? value : JSON.stringify(value ?? {}, null, 2);
    const truncateText = (value, limit = TEXT_LIMIT) => {
      const text = typeof value === 'string' ? value : pretty(value);
      if (text.length <= limit) return text;
      return `${text.slice(0, limit)}\n\n[truncated ${text.length - limit} characters]`;
    };
    const unique = (values) => [...new Set(values.filter(Boolean).map(String))].sort();
    const round = (value) => Number.isFinite(Number(value)) ? Number(value).toFixed(2) : 'n/a';
    const cleanPath = (path) => path.replaceAll('\\', '/').replace(/^\/+/, '');
    const isFileProtocol = () => window.location.protocol === 'file:';

    function configureProtocolMode() {
      if (!isFileProtocol()) return;
      const defaultButton = $('loadDefaultButton');
      defaultButton.disabled = true;
      defaultButton.textContent = 'Default unavailable on file://';
      $('rescanButton').disabled = true;
      $('sourceStatus').textContent = 'Browser blocks automatic default loading for file:// pages. Click Open output folder and select the output folder.';
    }

    async function loadDefaultOutputFolder() {
      if (isFileProtocol()) {
        $('sourceStatus').textContent = 'Browser blocks automatic default loading for file:// pages. Click Open output folder and select the output folder.';
        return;
      }
      $('sourceStatus').textContent = `Trying ${DEFAULT_OUTPUT_ROOT}...`;
      try {
        const files = await collectDefaultOutputFiles(DEFAULT_OUTPUT_ROOT);
        if (!files.length) throw new Error('No output files found.');
        state.folderHandle = null;
        state.files = files;
        $('rescanButton').disabled = false;
        await rebuildData(`Loaded default ${DEFAULT_OUTPUT_ROOT}.`);
      } catch (error) {
        $('sourceStatus').textContent = `Default ${DEFAULT_OUTPUT_ROOT} is not readable here. Use Open output folder.`;
        render();
      }
    }

    async function collectDefaultOutputFiles(rootUrl) {
      const root = new URL(rootUrl, window.location.href);
      const files = [];
      await collectDefaultDirectory(root, root, files, 0);
      return files;
    }

    async function collectDefaultDirectory(url, root, files, depth) {
      if (depth > 8) return;
      let html = '';
      try {
        html = await readUrlText(url.href);
      } catch {
        return;
      }
      const documentFragment = new DOMParser().parseFromString(html, 'text/html');
      const links = [...documentFragment.querySelectorAll('a[href]')]
        .map((link) => new URL(link.getAttribute('href'), url))
        .filter((candidate) => candidate.origin === root.origin && candidate.pathname.startsWith(root.pathname))
        .filter((candidate) => candidate.href !== url.href && !candidate.pathname.endsWith('/../'));

      for (const link of links) {
        if (link.pathname.length <= url.pathname.length) continue;
        if (link.pathname.endsWith('/')) {
          await collectDefaultDirectory(link, root, files, depth + 1);
        } else {
          const relativePath = decodeURIComponent(link.pathname.slice(root.pathname.length));
          const path = cleanPath(`output/${relativePath}`);
          if (!isRelevantOutputFile(path)) continue;
          files.push({
            path,
            file: {
              text: async () => {
                try {
                  return await readUrlText(link.href);
                } catch {
                  return '';
                }
              },
            },
          });
        }
      }
    }

    async function readUrlText(url) {
      if (typeof fetch === 'function') {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Unable to read ${url}`);
        return response.text();
      }
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open('GET', url);
        request.onload = () => {
          if (request.status >= 200 && request.status < 300) {
            resolve(request.responseText);
          } else {
            reject(new Error(`Unable to read ${url}`));
          }
        };
        request.onerror = () => reject(new Error(`Unable to read ${url}`));
        request.send();
      });
    }

    async function openOutputFolder() {
      if (isFileProtocol()) {
        state.folderHandle = null;
        $('folderInput').click();
        return;
      }
      if ('showDirectoryPicker' in window) {
        try {
          state.folderHandle = await window.showDirectoryPicker({ mode: 'read' });
          const permission = await ensureDirectoryReadPermission(state.folderHandle);
          if (!permission) {
            $('sourceStatus').textContent = 'Folder permission was not granted. Try Open output folder again or use the browser file picker fallback.';
            return;
          }
          await loadFromDirectoryHandle(state.folderHandle);
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
          $('sourceStatus').textContent = `Could not open folder with directory picker (${error?.name || 'Error'}). Trying browser file picker fallback.`;
        }
      }
      $('folderInput').click();
    }

    async function ensureDirectoryReadPermission(handle) {
      if (!handle || typeof handle.queryPermission !== 'function') return true;
      try {
        const options = { mode: 'read' };
        if (await handle.queryPermission(options) === 'granted') return true;
        if (typeof handle.requestPermission !== 'function') return false;
        return await handle.requestPermission(options) === 'granted';
      } catch {
        return true;
      }
    }

    async function loadFromDirectoryHandle(handle) {
      const files = [];
      state.skippedFiles = [];
      await collectDirectoryEntries(handle, '', files);
      state.files = files;
      $('rescanButton').disabled = false;
      await rebuildData(`Loaded ${files.length} files from ${handle.name || 'selected folder'}.`);
    }

    async function collectDirectoryEntries(handle, prefix, files) {
      for await (const [name, entry] of handle.entries()) {
        const path = prefix ? `${prefix}/${name}` : name;
        if (entry.kind === 'directory') {
          await collectDirectoryEntries(entry, path, files);
        } else if (entry.kind === 'file') {
          try {
            const file = await entry.getFile();
            files.push({ path, file });
          } catch (error) {
            state.skippedFiles.push({ path, reason: error?.name || 'NotReadableError' });
          }
        }
      }
    }

    async function loadFromFileInput(fileList) {
      state.folderHandle = null;
      state.skippedFiles = [];
      state.files = [...fileList].map((file) => ({ path: file.webkitRelativePath || file.name, file }));
      $('rescanButton').disabled = true;
      await rebuildData(`Loaded ${state.files.length} files from folder picker.`);
    }

    async function rescanCurrentFolder() {
      if (state.folderHandle) {
        await loadFromDirectoryHandle(state.folderHandle);
      } else if (state.files.length) {
        if (isFileProtocol()) {
          $('sourceStatus').textContent = 'Rescan is unavailable on file:// pages. Click Open output folder and select the folder again.';
          return;
        }
        await loadDefaultOutputFolder();
      }
    }

    async function rebuildData(statusText) {
      $('sourceStatus').textContent = 'Reading output files...';
      state.data = await parseOutputFiles(state.files);
      state.benchmark = 'all';
      state.model = 'all';
      state.method = 'all';
      state.run = 'all';
      state.exampleIndex = 0;
      state.agent = 'all';
      state.eventAgent = 'all';
      state.eventType = 'communication';
      state.accuracyModels = {};
      state.analysisBenchmark = '';
      state.analysisModels = {};
      state.analysisRuns = {};
      state.analysisMethod = 'multiagent_dynamic_streaming';
      state.analysisBaselineMethods = [];
      state.analysisRoundMetric = 'correct_majority';
      state.loadingExampleKey = '';
      state.analysisTraceLoadingKey = '';
      state.analysisTraceLoadProgress = null;
      $('sourceStatus').textContent = `${statusText} ${state.data.runs.length} runs found${formatSkippedFilesStatus()}.`;
      render();
    }

    async function parseOutputFiles(fileRecords) {
      const candidates = fileRecords
        .map((record) => ({ ...record, path: cleanPath(record.path) }))
        .filter((record) => isRelevantOutputFile(record.path));
      const filesByPath = new Map();
      const fileRecordsByPath = new Map();
      const metadataCandidates = [];
      candidates.forEach((record) => {
        fileRecordsByPath.set(record.path, record);
        if (!isExampleTracePath(record.path)) metadataCandidates.push(record);
      });

      for (let index = 0; index < metadataCandidates.length; index += 1) {
        const record = metadataCandidates[index];
        try {
          filesByPath.set(record.path, { path: record.path, text: await readRecordText(record) });
        } catch (error) {
          state.skippedFiles.push({ path: record.path, reason: error?.name || 'ReadError' });
        }
        if (index % 25 === 0) {
          $('sourceStatus').textContent = `Reading metadata files... ${index + 1}/${metadataCandidates.length}`;
          await yieldToBrowser();
        }
      }

      const summaryPaths = [...filesByPath.keys()].filter((path) => path.endsWith('/summary.json') || path === 'summary.json').sort();
      const runs = summaryPaths.map((summaryPath) => buildRun(summaryPath, filesByPath, fileRecordsByPath)).filter(Boolean);
      runs.sort((left, right) => String(right.run_id).localeCompare(String(left.run_id)));

      const benchmarkMap = new Map();
      for (const run of runs) {
        const current = benchmarkMap.get(run.benchmark) || { id: run.benchmark, label: run.benchmark_display_name, run_count: 0, example_count: 0 };
        current.run_count += 1;
        current.example_count += run.examples.length;
        benchmarkMap.set(run.benchmark, current);
      }
      return { generated_at: new Date().toISOString(), runs, benchmarks: [...benchmarkMap.values()].sort((a, b) => a.id.localeCompare(b.id)) };
    }

    async function readRecordText(record) {
      return record?.file && typeof record.file.text === 'function' ? record.file.text() : '';
    }

    async function yieldToBrowser() {
      await new Promise((resolve) => setTimeout(resolve, 0));
    }

    function formatSkippedFilesStatus() {
      const count = state.skippedFiles.length;
      if (!count) return '';
      const examples = state.skippedFiles.slice(0, 3).map((item) => item.path).join(', ');
      return `; skipped ${count} unreadable file${count === 1 ? '' : 's'}${examples ? ` (${examples}${count > 3 ? ', ...' : ''})` : ''}`;
    }

    function isRelevantOutputFile(path) {
      return path.endsWith('/summary.json') ||
        path.endsWith('/run_config.json') ||
        path.includes('/examples/') && path.endsWith('.json') ||
        path.endsWith('_results.csv') ||
        path.endsWith('/correctness.csv');
    }

    function isExampleTracePath(path) {
      return path.includes('/examples/') && path.endsWith('.json');
    }

    function parseJson(text) {
      try {
        const value = JSON.parse(text);
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      } catch {
        return {};
      }
    }

    function parseCsv(text, limit = 200) {
      const rows = [];
      const lines = text.split(/\r?\n/).filter(Boolean);
      if (!lines.length) return rows;
      const headers = splitCsvLine(lines[0]);
      for (const line of lines.slice(1, limit + 1)) {
        const values = splitCsvLine(line);
        const row = {};
        headers.forEach((header, index) => { row[header] = values[index] ?? ''; });
        rows.push(row);
      }
      return rows;
    }

    function splitCsvLine(line) {
      const values = [];
      let current = '';
      let quoted = false;
      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        const next = line[index + 1];
        if (char === '"' && quoted && next === '"') {
          current += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === ',' && !quoted) {
          values.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      values.push(current);
      return values;
    }

    function buildRun(summaryPath, filesByPath, fileRecordsByPath) {
      const runDir = summaryPath.replace(/\/?summary\.json$/, '').replace(/\/$/, '');
      const summary = parseJson(filesByPath.get(summaryPath)?.text || '{}');
      const runConfig = parseJson(filesByPath.get(`${runDir}/run_config.json`)?.text || '{}');
      const identity = inferRunIdentity(runDir, summary, runConfig);
      const lookup = buildResultLookup(summary);
      const exampleRecordPaths = [...fileRecordsByPath.keys()].filter((path) => path.startsWith(`${runDir}/examples/`) && path.endsWith('.json')).sort();
      const examples = buildLazyExamples(runDir, summary, lookup, exampleRecordPaths, fileRecordsByPath);
      const csvPath = [...filesByPath.keys()].find((path) => path.startsWith(`${runDir}/`) && path.endsWith('_results.csv'));
      const correctnessPath = [...filesByPath.keys()].find((path) => path === `${runDir}/correctness.csv`);
      return {
        ...identity,
        path: runDir,
        summary: typeof summary.summary === 'object' && summary.summary ? summary.summary : {},
        method_averages: typeof summary.method_averages === 'object' && summary.method_averages ? summary.method_averages : {},
        results: Array.isArray(summary.results) ? summary.results.map(compactResult) : [],
        run_config: runConfig,
        comparison: normalizeRunComparison(identity, summary, runConfig),
        csv_path: csvPath || '',
        csv_rows: csvPath ? parseCsv(filesByPath.get(csvPath).text) : [],
        correctness_rows: correctnessPath ? parseCsv(filesByPath.get(correctnessPath).text) : [],
        examples,
      };
    }

    function buildLazyExamples(runDir, summary, lookup, examplePaths, fileRecordsByPath) {
      const examplesByKey = new Map();
      const resultRows = Array.isArray(summary.results) ? summary.results : [];
      resultRows.forEach((row) => {
        if (!row || typeof row !== 'object') return;
        const method = String(row.method ?? '');
        const index = row.index ?? '';
        if (!method || index === '') return;
        const path = resolveExamplePath(runDir, row, examplePaths, fileRecordsByPath);
        const key = `${method}:${index}`;
        examplesByKey.set(key, makeLazyExample(path, row, fileRecordsByPath.get(path)));
      });
      examplePaths.forEach((path) => {
        const parsed = parseExamplePath(path);
        if (!parsed) return;
        const key = `${parsed.method}:${parsed.index}`;
        if (examplesByKey.has(key)) return;
        examplesByKey.set(key, makeLazyExample(path, lookup.get(key) || { method: parsed.method, index: parsed.index }, fileRecordsByPath.get(path)));
      });
      return [...examplesByKey.values()].sort((left, right) => {
        const byIndex = compareExampleIndex(left.index, right.index);
        return byIndex || String(left.method).localeCompare(String(right.method));
      });
    }

    function resolveExamplePath(runDir, row, examplePaths, fileRecordsByPath) {
      const rawPath = cleanPath(String(row.json_trace_path || ''));
      if (rawPath && fileRecordsByPath.has(rawPath)) return rawPath;
      const rawName = rawPath.split('/').pop();
      if (rawName) {
        const sameRunPath = `${runDir}/examples/${rawName}`;
        if (fileRecordsByPath.has(sameRunPath)) return sameRunPath;
      }
      const index = row.index ?? '';
      const method = String(row.method ?? '');
      const numericIndex = Number(index);
      const padded = Number.isFinite(numericIndex) ? String(numericIndex).padStart(4, '0') : String(index);
      const candidates = [
        `${runDir}/examples/${padded}_${method}.json`,
        `${runDir}/examples/${index}_${method}.json`,
      ];
      return candidates.find((path) => fileRecordsByPath.has(path)) ||
        examplePaths.find((path) => path.endsWith(`_${method}.json`) && parseExamplePath(path)?.index === String(index)) ||
        rawPath;
    }

    function parseExamplePath(path) {
      const filename = path.split('/').pop() || '';
      const match = filename.match(/^(\d+)_(.+)\.json$/);
      if (!match) return null;
      return { index: String(Number(match[1])), method: match[2] };
    }

    function makeLazyExample(path, row, fileRecord) {
      const result = compactResult(row);
      return {
        path,
        index: row.index ?? '',
        method: row.method ?? '',
        route_mode: '',
        benchmark: row.benchmark || '',
        correct: row.correct,
        pred: row.pred,
        gold: row.gold,
        score_metadata: normalizeScoreMetadata(row.score_metadata),
        error: truncateText(row.error || ''),
        prompt: '',
        raw_output: truncateText(row.raw_output || ''),
        result,
        analysis_target_method: row.method ?? '',
        candidate_aggregation: null,
        summarizer_raw_response: '',
        summarizer_final_answer: '',
        final_answer: '',
        selected_agents: [],
        agents: [],
        summarizer: null,
        synthesizer_trace_present: false,
        synthesizer_trace_mode: '',
        synthesizer_trace_token_usage: normalizeTokenUsage(null),
        events: [],
        receipts: [],
        workflow: [],
        orchestrator_plan: {},
        orchestrator: normalizeOrchestrator({}),
        dynamic_orchestration: null,
        raw_trace_excerpt: 'Trace not loaded yet.',
        lazy_trace_path: path,
        file_record: fileRecord || null,
        trace_loaded: false,
        trace_error: '',
      };
    }

    function scheduleExampleTraceLoad(example) {
      if (!example || example.trace_loaded || example.trace_error) return;
      const key = example.lazy_trace_path || example.path;
      if (!key || state.loadingExampleKey === key) return;
      state.loadingExampleKey = key;
      window.setTimeout(async () => {
        await loadExampleTrace(example);
        if (state.loadingExampleKey === key) state.loadingExampleKey = '';
        render();
      }, 0);
    }

    async function loadExampleTrace(example) {
      if (!example.file_record) {
        example.trace_error = 'Trace file was not found in the selected folder.';
        return;
      }
      try {
        const text = await readRecordText(example.file_record);
        const lookup = new Map([[`${example.method}:${example.index}`, example.result || {}]]);
        const loaded = normalizeExample(example.path, parseJson(text), lookup);
        Object.assign(example, loaded, {
          lazy_trace_path: example.lazy_trace_path,
          file_record: example.file_record,
          trace_loaded: true,
          trace_error: '',
        });
      } catch (error) {
        example.trace_error = error?.name || error?.message || 'ReadError';
      }
    }

    function unloadedAnalysisTraceExamples(run, targetMethod) {
      if (!run || targetMethod !== 'multiagent_dynamic_streaming') return [];
      return (run.examples || []).filter((example) =>
        example.method === targetMethod &&
        !example.trace_loaded &&
        !example.trace_error &&
        example.file_record
      );
    }

    function analysisTraceLoadKey(run, targetMethod) {
      return `${run?.path || run?.run_id || 'unknown'}:${targetMethod}`;
    }

    function scheduleAnalysisTraceLoad(run, targetMethod) {
      const unloaded = unloadedAnalysisTraceExamples(run, targetMethod);
      if (!unloaded.length) return;
      const key = analysisTraceLoadKey(run, targetMethod);
      if (state.analysisTraceLoadingKey === key) return;
      state.analysisTraceLoadingKey = key;
      state.analysisTraceLoadProgress = { key, loaded: 0, total: unloaded.length };
      window.setTimeout(async () => {
        for (let index = 0; index < unloaded.length; index += 1) {
          await loadExampleTrace(unloaded[index]);
          if (state.analysisTraceLoadingKey !== key) return;
          state.analysisTraceLoadProgress = { key, loaded: index + 1, total: unloaded.length };
          if (index % 10 === 0) await yieldToBrowser();
        }
        if (state.analysisTraceLoadingKey === key) {
          state.analysisTraceLoadingKey = '';
          state.analysisTraceLoadProgress = null;
          render();
        }
      }, 0);
    }

    function inferRunIdentity(runDir, summary, runConfig) {
      const parts = runDir.split('/').filter(Boolean);
      const config = Object.keys(runConfig).length ? runConfig : (summary.run_config || {});
      const settings = config.settings || {};
      const runId = String(config.run_id || parts.at(-1) || 'unknown');
      const benchmark = String(config.benchmark || parts.at(-3) || parts.at(-2) || 'unknown');
      const model = String(parts.length >= 3 ? parts.at(-2) : settings.model || 'unknown');
      return {
        benchmark,
        benchmark_display_name: String(config.benchmark_display_name || benchmark),
        model,
        resolved_model: String(settings.resolved_model || model),
        run_id: runId,
      };
    }

    function normalizeRunComparison(identity, summary, runConfig) {
      const config = Object.keys(runConfig).length ? runConfig : (summary.run_config || {});
      const explicit = config.comparison && typeof config.comparison === 'object' ? config.comparison : {};
      const settings = config.settings || {};
      const scope = explicit.scope && typeof explicit.scope === 'object' ? explicit.scope : {
        benchmark: identity.benchmark,
        resolved_model: settings.resolved_model || identity.resolved_model || identity.model,
        limit: settings.limit ?? null,
        seed: settings.seed ?? null,
        data_file: settings.data_file ?? null,
        ma_proofbench_level: settings.ma_proofbench_level ?? null,
        olymmath_subset: settings.olymmath_subset ?? null,
        swebench_instance_ids: settings.swebench_instance_ids ?? null,
      };
      return {
        schema_version: explicit.schema_version || 0,
        fingerprint: explicit.fingerprint || stableStringify(scope),
        compatibility_key: stableStringify(scope),
        scope,
      };
    }

    function buildResultLookup(summary) {
      const lookup = new Map();
      if (!Array.isArray(summary.results)) return lookup;
      for (const row of summary.results) {
        if (!row || typeof row !== 'object') continue;
        lookup.set(`${row.method ?? ''}:${row.index ?? ''}`, row);
      }
      return lookup;
    }

    function normalizeExample(path, trace, lookup) {
      const methodTrace = trace.method_trace && typeof trace.method_trace === 'object' ? trace.method_trace : {};
      const filename = path.split('/').pop() || '';
      const match = filename.match(/^(\d+)_(.+)\.json$/);
      const fallbackIndex = match ? String(Number(match[1])) : '';
      const fallbackMethod = match ? match[2] : '';
      const index = trace.index ?? fallbackIndex;
      const method = trace.method ?? fallbackMethod;
      const result = lookup.get(`${method}:${index}`) || {};
      const agents = normalizeAgents(methodTrace);
      const summarizerTrace = methodTrace.synthesizer_trace && typeof methodTrace.synthesizer_trace === 'object'
        ? methodTrace.synthesizer_trace
        : null;
      return {
        path,
        index,
        method,
        route_mode: methodTrace.mode || '',
        benchmark: trace.benchmark || result.benchmark || '',
        correct: trace.correct ?? result.correct,
        pred: trace.pred ?? result.pred,
        gold: trace.gold ?? result.gold,
        score_metadata: normalizeScoreMetadata(trace.score_metadata ?? result.score_metadata),
        error: truncateText(trace.error ?? result.error ?? ''),
        prompt: truncateText(trace.prompt || methodTrace.prompt || ''),
        raw_output: truncateText(trace.raw_output || result.raw_output || ''),
        result: compactResult(result),
        analysis_target_method: method,
        candidate_aggregation: summarizerTrace?.candidate_aggregation || null,
        summarizer_raw_response: summarizerTrace?.raw_response || '',
        summarizer_final_answer: summarizerTrace?.final_answer || methodTrace.final_answer || '',
        final_answer: methodTrace.final_answer || '',
        selected_agents: selectedAgents(methodTrace),
        agents,
        summarizer: normalizeSummarizerTrace(methodTrace),
        synthesizer_trace_present: Boolean(summarizerTrace),
        synthesizer_trace_mode: summarizerTrace?.mode || methodTrace.synthesizer_mode || '',
        synthesizer_trace_token_usage: normalizeTokenUsage(summarizerTrace?.token_usage),
        events: normalizeEvents(methodTrace),
        receipts: normalizeReceipts(agents),
        workflow: Array.isArray(methodTrace.workflow) ? methodTrace.workflow : [],
        orchestrator_plan: methodTrace.orchestrator_plan || {},
        orchestrator: normalizeOrchestrator(methodTrace),
        dynamic_orchestration: normalizeDynamicOrchestration(methodTrace),
        raw_trace_excerpt: truncateText(trace, 80000),
      };
    }

    function normalizeOrchestrator(methodTrace) {
      return {
        plan: methodTrace.orchestrator_plan || {},
        reason: methodTrace.reason || methodTrace.orchestrator_plan?.reason || '',
        assignments: Array.isArray(methodTrace.assignments) ? methodTrace.assignments : [],
        selected_agents: Array.isArray(methodTrace.selected_agents)
          ? methodTrace.selected_agents
          : selectedAgents(methodTrace),
        raw_output: methodTrace.orchestrator_raw_output || methodTrace.raw_orchestrator_output || '',
        prompt: methodTrace.orchestrator_prompt || '',
      };
    }

    function normalizeDynamicOrchestration(methodTrace) {
      const trace = methodTrace.dynamic_orchestration_trace && typeof methodTrace.dynamic_orchestration_trace === 'object'
        ? methodTrace.dynamic_orchestration_trace
        : null;
      if (!trace) return null;
      return {
        final_answer: trace.final_answer || methodTrace.final_answer || '',
        forced_final: Boolean(trace.forced_final),
        max_orchestrator_rounds: trace.max_orchestrator_rounds,
        workflow_plan: Array.isArray(trace.workflow_plan) ? trace.workflow_plan : [],
        subagent_pool: Array.isArray(trace.subagent_pool) ? trace.subagent_pool : [],
        rounds: Array.isArray(trace.rounds) ? trace.rounds : [],
      };
    }

    function compactResult(row) {
      if (!row || typeof row !== 'object') return {};
      const keys = ['benchmark', 'method', 'index', 'gold', 'pred', 'correct', 'returncode', 'error', 'elapsed_seconds', 'prompt_tokens', 'completion_tokens', 'total_tokens', 'score_metadata', 'json_trace_path'];
      const output = {};
      keys.forEach((key) => {
        if (Object.hasOwn(row, key)) output[key] = row[key];
      });
      output.raw_output = truncateText(row.raw_output || '');
      return output;
    }

    function selectedAgents(methodTrace) {
      const plan = methodTrace.orchestrator_plan;
      return plan && Array.isArray(plan.selected_agents) ? plan.selected_agents.filter((agent) => agent && typeof agent === 'object') : [];
    }

    function normalizeAgents(methodTrace) {
      if (methodTrace.method === 'single_agent') {
        return normalizeSingleAgentTrace(methodTrace);
      }
      if (methodTrace.method === 'majority_vote') {
        return normalizeMajorityVoteTrace(methodTrace);
      }
      if (methodTrace.method === 'multiagent_debate') {
        return normalizeDebateTrace(methodTrace);
      }
      return normalizeNamedAgentTraces(methodTrace);
    }

    function normalizeNamedAgentTraces(methodTrace) {
      if (methodTrace.direct_trace && typeof methodTrace.direct_trace === 'object') {
        return [normalizeDirectTrace(methodTrace)];
      }
      const traces = methodTrace.agent_traces && typeof methodTrace.agent_traces === 'object' ? methodTrace.agent_traces : {};
      const outputs = methodTrace.agent_outputs && typeof methodTrace.agent_outputs === 'object' ? methodTrace.agent_outputs : {};
      const names = [];
      selectedAgents(methodTrace).forEach((agent) => { if (agent.name && !names.includes(agent.name)) names.push(agent.name); });
      Object.keys(traces).forEach((name) => { if (!names.includes(name)) names.push(name); });
      Object.keys(outputs).forEach((name) => { if (!names.includes(name)) names.push(name); });
      return names.map((name) => {
        const trace = traces[name] && typeof traces[name] === 'object' ? traces[name] : {};
        const steps = Array.isArray(trace.steps) ? trace.steps : [];
        const finalOutput = trace.final_output || outputs[name] || '';
        return {
          name,
          assignment: trace.assignment || {},
          steps: steps.filter((step) => step && typeof step === 'object').map(normalizeStep),
          event_receipts: Array.isArray(trace.event_receipts) ? trace.event_receipts : [],
          unused_received_events: Array.isArray(trace.unused_received_events) ? trace.unused_received_events : [],
          final_output: truncateText(finalOutput),
          tools: findToolActions(String(finalOutput)),
        };
      });
    }

    function normalizeDirectTrace(methodTrace) {
      const trace = methodTrace.direct_trace && typeof methodTrace.direct_trace === 'object' ? methodTrace.direct_trace : {};
      const steps = Array.isArray(trace.steps) ? trace.steps : [];
      return {
        name: 'DirectAgent',
        assignment: {
          method: methodTrace.method || '',
          mode: trace.mode || 'direct',
          route_reason: methodTrace.reason || methodTrace.orchestrator_plan?.reason || '',
        },
        steps: steps.filter((step) => step && typeof step === 'object').map((step) => {
          const rawResponse = truncateText(step.raw_response || '');
          return {
            step: step.step,
            prompt: truncateText(step.prompt || ''),
            raw_response: rawResponse,
            parsed_output: {
              kind: step.kind || '',
              timed_out: Boolean(step.timed_out),
            },
            published_events: [],
            inbox_events: [],
            used_event_ids: [],
            token_usage: normalizeTokenUsage(step.token_usage),
            open_prompt: true,
            duration_seconds: step.duration_seconds,
            is_reactive: false,
            reactive_reason: '',
            tools: findToolActions(rawResponse),
          };
        }),
        event_receipts: [],
        unused_received_events: [],
        final_output: truncateText(trace.final_answer || methodTrace.final_answer || ''),
        tools: findToolActions(String(trace.final_answer || methodTrace.final_answer || '')),
      };
    }

    function normalizeMajorityVoteTrace(methodTrace) {
      const namedAgents = normalizeNamedAgentTraces(methodTrace);
      if (namedAgents.length) return namedAgents;
      const runs = Array.isArray(methodTrace.agent_runs) ? methodTrace.agent_runs : [];
      return runs.filter((run) => run && typeof run === 'object').map((run, index) => {
        const trace = run.trace && typeof run.trace === 'object' ? run.trace : {};
        const steps = Array.isArray(trace.steps) ? trace.steps : [];
        const finalOutput = run.raw_output || trace.raw_output || '';
        return {
          name: String(run.agent_name || `VoterAgent${run.agent || index + 1}`),
          assignment: {
            method: 'majority_vote',
            vote: run.agent ?? index + 1,
            parsed_answer: run.parsed_answer,
            returncode: run.returncode,
            stopped_reason: trace.stopped_reason || '',
          },
          steps: steps.filter((step) => step && typeof step === 'object').map((step) => normalizeSingleAgentStep(step, trace)),
          event_receipts: [],
          unused_received_events: [],
          final_output: truncateText(finalOutput),
          tools: findToolActions(String(finalOutput)),
        };
      });
    }

    function normalizeDebateTrace(methodTrace) {
      const namedAgents = normalizeNamedAgentTraces(methodTrace);
      if (namedAgents.length) return namedAgents;
      const contexts = Array.isArray(methodTrace.agent_contexts) ? methodTrace.agent_contexts : [];
      const rounds = Array.isArray(methodTrace.round_traces) ? methodTrace.round_traces : [];
      const agentCount = Number(methodTrace.agents || contexts.length || 0);
      return Array.from({ length: agentCount }, (_, agentIndex) => {
        const finalOutput = Array.isArray(methodTrace.final_outputs) ? methodTrace.final_outputs[agentIndex] || '' : '';
        const steps = rounds.map((round, roundIndex) => {
          const responses = round && Array.isArray(round.agent_responses) ? round.agent_responses : [];
          const response = responses.find((item) => Number(item?.agent) === agentIndex + 1) || responses[agentIndex] || {};
          return {
            step: round?.round ?? roundIndex + 1,
            prompt: truncateText(response.prompt || ''),
            raw_response: truncateText(response.response || ''),
            parsed_output: {
              round: round?.round ?? roundIndex + 1,
              output: response.response || '',
            },
            published_events: [],
            inbox_events: [],
            used_event_ids: [],
            token_usage: normalizeTokenUsage(response.token_usage),
            open_prompt: false,
            duration_seconds: response.duration_seconds,
            is_reactive: false,
            reactive_reason: '',
            tools: findToolActions(String(response.response || '')),
          };
        });
        return {
          name: `DebateAgent${agentIndex + 1}`,
          assignment: {
            method: 'multiagent_debate',
            agent: agentIndex + 1,
            prompt_style: methodTrace.prompt_style || '',
          },
          steps,
          event_receipts: [],
          unused_received_events: [],
          final_output: truncateText(finalOutput),
          tools: findToolActions(String(finalOutput)),
        };
      });
    }

    function normalizeSingleAgentTrace(methodTrace) {
      const steps = Array.isArray(methodTrace.steps) ? methodTrace.steps : [];
      return [{
        name: 'SingleAgent',
        assignment: {
          method: 'single_agent',
          min_steps: methodTrace.single_agent_min_steps,
          max_steps: methodTrace.single_agent_max_steps,
          stopped_reason: methodTrace.stopped_reason || '',
        },
        steps: steps.filter((step) => step && typeof step === 'object').map((step) => normalizeSingleAgentStep(step, methodTrace)),
        event_receipts: [],
        unused_received_events: [],
        final_output: truncateText(methodTrace.raw_output || ''),
        tools: findToolActions(String(methodTrace.raw_output || '')),
      }];
    }

    function normalizeSummarizerTrace(methodTrace) {
      const trace = methodTrace.synthesizer_trace && typeof methodTrace.synthesizer_trace === 'object'
        ? methodTrace.synthesizer_trace
        : null;
      if (!trace) return null;
      const rawResponse = truncateText(trace.raw_response || trace.final_answer || '');
      return {
        name: 'Summarizer',
        assignment: {
          method: methodTrace.method || '',
          mode: trace.mode || methodTrace.synthesizer_mode || '',
          timed_out: Boolean(trace.timed_out),
        },
        steps: [{
          step: 1,
          prompt: truncateText(trace.prompt || ''),
          raw_response: rawResponse,
          parsed_output: {
            final_answer: trace.final_answer || '',
            timed_out: Boolean(trace.timed_out),
            mode: trace.mode || methodTrace.synthesizer_mode || '',
          },
          published_events: [],
          inbox_events: [],
          used_event_ids: [],
          token_usage: normalizeTokenUsage(trace.token_usage),
          open_prompt: true,
          duration_seconds: trace.duration_seconds,
          is_reactive: false,
          reactive_reason: '',
          tools: findToolActions(rawResponse),
        }],
        event_receipts: [],
        unused_received_events: [],
        final_output: truncateText(trace.final_answer || rawResponse),
        tools: findToolActions(String(trace.final_answer || rawResponse)),
      };
    }

    function normalizeSingleAgentStep(step, methodTrace) {
      const rawResponse = truncateText(step.raw_response || step.output || '');
      return {
        step: step.step,
        prompt: truncateText(step.prompt || methodTrace.prompt || ''),
        raw_response: rawResponse,
        parsed_output: {
          status: step.status,
          output: step.output,
          notes: step.notes,
          parsed_answer: step.parsed_answer,
          final_reason: step.final_reason,
          final_accepted: step.final_accepted,
          final_blocked_reason: step.final_blocked_reason,
        },
        published_events: [],
        inbox_events: [],
        used_event_ids: [],
        token_usage: normalizeTokenUsage(step.token_usage),
        open_prompt: true,
        duration_seconds: step.duration_seconds,
        is_reactive: false,
        reactive_reason: '',
        tools: findToolActions(rawResponse),
      };
    }

    function normalizeStep(step) {
      const rawResponse = truncateText(step.raw_response || '');
      return {
        step: step.step,
        prompt: truncateText(step.prompt || ''),
        raw_response: rawResponse,
        parsed_output: step.parsed_output || {},
        published_events: Array.isArray(step.published_events) ? step.published_events : [],
        inbox_events: Array.isArray(step.inbox_events) ? step.inbox_events : [],
        used_event_ids: Array.isArray(step.used_event_ids) ? step.used_event_ids : [],
        token_usage: normalizeTokenUsage(step.token_usage),
        open_prompt: false,
        duration_seconds: step.duration_seconds,
        is_reactive: Boolean(step.is_reactive),
        reactive_reason: step.reactive_reason || '',
        tools: findToolActions(rawResponse),
      };
    }

    function normalizeTokenUsage(tokenUsage) {
      const usage = tokenUsage && typeof tokenUsage === 'object' ? tokenUsage : {};
      return {
        prompt_tokens: usage.prompt_tokens ?? null,
        completion_tokens: usage.completion_tokens ?? null,
        total_tokens: usage.total_tokens ?? null,
      };
    }

    function normalizeScoreMetadata(scoreMetadata) {
      if (!scoreMetadata) return {};
      if (typeof scoreMetadata === 'object') return scoreMetadata;
      if (typeof scoreMetadata === 'string') {
        try {
          const parsed = JSON.parse(scoreMetadata.replace(/'/g, '"'));
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }
      return {};
    }

    function formatTokenUsage(tokenUsage) {
      const usage = normalizeTokenUsage(tokenUsage);
      return `prompt=${formatTokenValue(usage.prompt_tokens)}, completion=${formatTokenValue(usage.completion_tokens)}, total=${formatTokenValue(usage.total_tokens)}`;
    }

    function formatTokenValue(value) {
      if (value === null || value === undefined || value === '') return 'unknown';
      return String(value);
    }

    function normalizeEvents(methodTrace) {
      if (!Array.isArray(methodTrace.event_log)) return [];
      return methodTrace.event_log.filter((event) => event && typeof event === 'object').map((event) => ({
        event_id: event.event_id,
        event_type: event.event_type,
        source: event.source,
        target: event.target || 'broadcast',
        content: truncateText(event.content || ''),
        created_at: event.created_at,
        metadata: event.metadata || {},
        tools: findToolActions(String(event.content || '')),
      }));
    }

    function normalizeReceipts(agents) {
      return agents.flatMap((agent) => agent.event_receipts.filter((receipt) => receipt && typeof receipt === 'object').map((receipt) => ({
        agent_name: agent.name,
        event_id: receipt.event_id,
        event_type: receipt.event_type,
        source: receipt.source,
        accepted: Boolean(receipt.accepted),
        ignored_reason: receipt.ignored_reason,
        used_in_step: receipt.used_in_step,
        content: truncateText(receipt.content || ''),
      })));
    }

    function findToolActions(text) {
      const actions = [];
      let cursor = 0;
      while (true) {
        const actionAt = text.indexOf('ACTION:', cursor);
        if (actionAt === -1) break;
        const snippet = text.slice(actionAt + 'ACTION:'.length).trimStart();
        try {
          const parsed = JSON.parse(snippet.slice(0, findJsonObjectEnd(snippet)));
          if (parsed && typeof parsed === 'object') {
            actions.push({
              tool: String(parsed.tool || parsed.name || 'unknown'),
              command: String(parsed.command || parsed.cmd || parsed.input || ''),
              raw: pretty(parsed),
            });
          }
        } catch {
          // Keep scanning; some model outputs contain malformed ACTION blocks.
        }
        cursor = actionAt + 'ACTION:'.length;
      }
      for (const match of text.matchAll(/Unsupported tool requested:\s*([^\n]+)/g)) {
        actions.push({ tool: match[1].trim(), command: 'unsupported', raw: match[0] });
      }
      return actions;
    }

    function findJsonObjectEnd(text) {
      let depth = 0;
      let quoted = false;
      let escaped = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        if (escaped) {
          escaped = false;
          continue;
        }
        if (char === '\\' && quoted) {
          escaped = true;
          continue;
        }
        if (char === '"') quoted = !quoted;
        if (quoted) continue;
        if (char === '{') depth += 1;
        if (char === '}') {
          depth -= 1;
          if (depth === 0) return index + 1;
        }
      }
      return text.length;
    }

    function filteredRuns() {
      const query = state.search.trim().toLowerCase();
      return runsForRunFilter().filter((run) => {
        if (state.run !== 'all' && run.path !== state.run) return false;
        return !query || JSON.stringify(run).toLowerCase().includes(query);
      });
    }

    function runMethods(run) {
      return unique(run.results.map((row) => row.method).concat(run.examples.map((example) => example.method)));
    }

    function matchesBenchmark(run) {
      return state.benchmark === 'all' || run.benchmark === state.benchmark;
    }

    function matchesModel(run) {
      return state.model === 'all' || run.model === state.model || run.resolved_model === state.model;
    }

    function matchesMethod(run) {
      return state.method === 'all' || runMethods(run).includes(state.method);
    }

    function runsForModelFilter() {
      return state.data.runs.filter((run) => matchesBenchmark(run));
    }

    function runsForMethodFilter() {
      return runsForModelFilter().filter((run) => matchesModel(run));
    }

    function runsForRunFilter() {
      return runsForMethodFilter().filter((run) => matchesMethod(run));
    }

    function currentRun() {
      const runs = filteredRuns();
      return runs[0] || null;
    }

    function currentExample(run) {
      if (!run || !run.examples.length) return null;
      return run.examples[Math.min(state.exampleIndex, run.examples.length - 1)] || run.examples[0];
    }

    function setOptions(select, values, selected, allLabel) {
      select.innerHTML = `<option value="all">${allLabel}</option>${values.map((value) => `<option value="${esc(value)}">${esc(value)}</option>`).join('')}`;
      select.value = values.includes(selected) ? selected : 'all';
    }

    function render() {
      renderFilters();
      const runs = filteredRuns();
      const run = currentRun();
      const example = currentExample(run);
      renderStats(runs);
      renderPageTabs();
      renderAccuracyPanel();
      renderRunAnalysisPanel();
      renderRunList(runs);
      renderRunPanel(run);
      renderExampleSelect(run);
      renderTabs(example);
      renderTab(example);
      $('accuracyPanel').classList.toggle('hidden', state.page !== 'accuracy');
      $('analysisPanel').classList.toggle('hidden', state.page !== 'analysis');
      $('detailPage').classList.toggle('hidden', state.page !== 'detail');
    }

    function renderPageTabs() {
      const pages = [
        ['accuracy', 'Accuracy Overview'],
        ['analysis', 'Run Analysis'],
        ['detail', 'Run Detail'],
      ];
      $('pageTabs').innerHTML = pages.map(([id, label]) => `<button class="page-tab ${state.page === id ? 'active' : ''}" type="button" data-page="${id}">${label}</button>`).join('');
      document.querySelectorAll('[data-page]').forEach((button) => {
        button.addEventListener('click', () => {
          state.page = button.dataset.page;
          render();
        });
      });
    }

    function renderFilters() {
      const runs = state.data.runs;
      const benchmarks = unique(runs.map((run) => run.benchmark));
      if (state.benchmark !== 'all' && !benchmarks.includes(state.benchmark)) state.benchmark = 'all';

      const models = unique(runsForModelFilter().flatMap((run) => [run.model, run.resolved_model]));
      if (state.model !== 'all' && !models.includes(state.model)) state.model = 'all';

      const methods = unique(runsForMethodFilter().flatMap((run) => runMethods(run)));
      if (state.method !== 'all' && !methods.includes(state.method)) state.method = 'all';

      const runPaths = runsForRunFilter().map((run) => run.path);
      if (state.run !== 'all' && !runPaths.includes(state.run)) state.run = 'all';

      setOptions($('benchmarkFilter'), benchmarks, state.benchmark, 'All benchmarks');
      setOptions($('modelFilter'), models, state.model, 'All models');
      setOptions($('methodFilter'), methods, state.method, 'All methods');
      setOptions($('runFilter'), runPaths, state.run, 'Latest matching run');
      $('searchFilter').value = state.search;
    }

    function renderStats(runs) {
      const examples = runs.reduce((total, run) => total + run.examples.length, 0);
      const rows = runs.flatMap((run) => run.results);
      const correct = rows.filter((row) => row.correct === true || row.correct === 'True').length;
      const errors = rows.filter((row) => row.error).length;
      $('stats').innerHTML = [
        ['Runs', runs.length],
        ['Examples', examples],
        ['Correct rows', correct],
        ['Rows with errors', errors],
      ].map(([label, value]) => `<div class="stat"><span class="subtle">${label}</span><strong>${value}</strong></div>`).join('');
    }

    function renderAccuracyPanel() {
      const groups = accuracyBenchmarkGroups();
      if (!groups.length) {
        $('accuracyPanel').innerHTML = '<div class="empty">No benchmark summary rows match the current benchmark/model/method filters.</div>';
        return;
      }
      $('accuracyPanel').innerHTML = `
        <div class="toolbar">
          <div>
            <h2>Latest Benchmark Accuracy</h2>
            <div class="subtle">One block per benchmark. Fake benchmark/model runs are excluded. Each model selector defaults to that benchmark's latest model.</div>
          </div>
          <span class="pill">${esc(groups.length)} benchmark blocks</span>
        </div>
        ${groups.map(renderBenchmarkAccuracyBlock).join('')}
      `;
    }

    function accuracyBenchmarkGroups() {
      const runsByBenchmark = new Map();
      const runs = state.data.runs
        .filter((run) => !isExcludedAccuracyRun(run))
        .filter((run) => matchesBenchmark(run))
        .filter((run) => state.method === 'all' || runMethods(run).includes(state.method));
      for (const run of runs) {
        const benchmarkRuns = runsByBenchmark.get(run.benchmark) || [];
        benchmarkRuns.push(run);
        runsByBenchmark.set(run.benchmark, benchmarkRuns);
      }
      return [...runsByBenchmark.entries()].sort(([left], [right]) => left.localeCompare(right)).map(([benchmark, benchmarkRuns]) => {
        const models = latestModelsForBenchmark(benchmarkRuns);
        const selectedModel = selectedAccuracyModel(benchmark, models);
        const latestRun = latestRunForModel(benchmarkRuns, selectedModel);
        const compatibleRuns = latestRun ? compatibleAccuracyRuns(benchmarkRuns, selectedModel, latestRun) : [];
        return {
          benchmark,
          label: latestRun?.benchmark_display_name || benchmark,
          models,
          selected_model: selectedModel,
          run: latestRun,
          compatible_runs: compatibleRuns,
          rows: latestRun ? comparisonMethodRows(compatibleRuns, latestRun) : [],
        };
      }).filter((group) => group.run && group.rows.length);
    }

    function latestModelsForBenchmark(runs) {
      const latestByModel = new Map();
      for (const run of runs) {
        const model = accuracyModelName(run);
        const current = latestByModel.get(model);
        if (!current || compareRunRecency(run, current) > 0) {
          latestByModel.set(model, run);
        }
      }
      return [...latestByModel.entries()]
        .sort(([, leftRun], [, rightRun]) => compareRunRecency(rightRun, leftRun))
        .map(([model]) => model);
    }

    function selectedAccuracyModel(benchmark, models) {
      const selected = state.accuracyModels[benchmark];
      if (selected && models.includes(selected)) return selected;
      const fallback = models[0] || '';
      if (fallback) state.accuracyModels[benchmark] = fallback;
      return fallback;
    }

    function latestRunForModel(runs, model) {
      return runs
        .filter((run) => accuracyModelName(run) === model)
        .sort((left, right) => compareRunRecency(right, left))[0] || null;
    }

    function renderBenchmarkAccuracyBlock(group) {
      return `
        <section class="benchmark-block">
          <div class="toolbar">
            <div>
              <h3>${esc(group.label)}</h3>
              <div class="subtle">anchor run: ${esc(group.run.run_id)} · compatible runs: ${esc(group.compatible_runs.length)}</div>
            </div>
            <div class="field">
              <label for="accuracyModel_${esc(group.benchmark)}">Model</label>
              <select id="accuracyModel_${esc(group.benchmark)}" onchange="setAccuracyModel('${esc(jsString(group.benchmark))}', this.value)">
                ${group.models.map((model) => `<option value="${esc(model)}" ${group.selected_model === model ? 'selected' : ''}>${esc(model)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="benchmark-methods">
            ${group.rows.map(renderBenchmarkMethodRow).join('')}
          </div>
        </section>
      `;
    }

    function renderBenchmarkMethodRow(row) {
      return `
        <div class="method-row">
          <strong>${esc(row.method)}</strong>
          <div>
            <span class="metric-label">Accuracy</span>
            <div class="bar-track"><div class="bar-fill" style="width: ${esc(barWidth(row.accuracy, 1))}%"></div></div>
          </div>
          <div><span class="metric-label">Acc</span><strong>${esc(percent(row.accuracy))}</strong></div>
          <div><span class="metric-label">Correct / Total</span>${esc(row.correct)} / ${esc(row.total)}</div>
          <div><span class="metric-label">Invalid</span>${esc(row.invalid)} (${esc(percent(row.invalid_rate))})</div>
          <div><span class="metric-label">Avg tokens</span>${esc(round(row.avg_total_tokens))}</div>
          <div><span class="metric-label">Source</span>${renderSourceCell(row)}</div>
          ${renderRouteBreakdown(row)}
          ${renderDynamicOrchestrationRoundBreakdown(row)}
        </div>
      `;
    }

    function renderSourceCell(row) {
      const sourceClass = row.source_is_current ? 'current' : 'reused';
      const label = row.source_is_current ? 'current' : 'reused';
      const details = [
        `Full source run: ${row.source_run_id || row.run_id || ''}`,
        `Path: ${row.source_path || ''}`,
      ].filter(Boolean).join('\n');
      return `<span class="source-chip ${sourceClass}" title="${esc(details)}" aria-label="${esc(details)}">${esc(label)}</span>`;
    }

    function renderRouteBreakdown(row) {
      if (row.method !== 'multiagent_dynamic_streaming' || !row.route_breakdown) return '';
      const direct = row.route_breakdown.direct;
      const multiAgent = row.route_breakdown.multi_agent;
      return `
        <div class="route-breakdown">
          <span class="metric-label">Dynamic route split</span>
          <span class="pill">direct: ${esc(direct.total)} · acc ${esc(percent(direct.accuracy))} · ${esc(direct.correct)}/${esc(direct.total)}</span>
          <span class="pill">multi_agent: ${esc(multiAgent.total)} · acc ${esc(percent(multiAgent.accuracy))} · ${esc(multiAgent.correct)}/${esc(multiAgent.total)}</span>
        </div>
      `;
    }

    function renderDynamicOrchestrationRoundBreakdown(row) {
      if (row.method !== 'dynamic_orchestration' || !Array.isArray(row.round_breakdown) || !row.round_breakdown.length) return '';
      return `
        <div class="route-breakdown">
          <span class="metric-label">Dynamic orchestration rounds</span>
          ${row.round_breakdown.map((item) => `
            <span class="pill">${esc(item.label)}: ${esc(item.total)} · acc ${esc(percent(item.accuracy))} · ${esc(item.correct)}/${esc(item.total)}</span>
          `).join('')}
        </div>
      `;
    }

    function setAccuracyModel(benchmark, model) {
      state.accuracyModels[benchmark] = model;
      state.page = 'accuracy';
      render();
    }

    function accuracyModelName(run) {
      return String(run.resolved_model || run.model || 'unknown');
    }

    function isExcludedAccuracyRun(run) {
      return isFakeLabel(run.benchmark) ||
        isFakeLabel(run.benchmark_display_name) ||
        isFakeLabel(run.model) ||
        isFakeLabel(run.resolved_model);
    }

    function isFakeLabel(value) {
      return String(value || '').toLowerCase().includes('fake');
    }

    function jsString(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function compareRunRecency(left, right) {
      const leftKey = `${left.run_id || ''} ${left.path || ''}`;
      const rightKey = `${right.run_id || ''} ${right.path || ''}`;
      return leftKey.localeCompare(rightKey);
    }

    function compatibleAccuracyRuns(runs, model, anchorRun) {
      const anchorFingerprint = comparisonFingerprint(anchorRun);
      return runs
        .filter((run) => accuracyModelName(run) === model)
        .filter((run) => comparisonFingerprint(run) === anchorFingerprint)
        .sort((left, right) => compareRunRecency(right, left));
    }

    function comparisonFingerprint(run) {
      return run?.comparison?.compatibility_key || run?.comparison?.fingerprint || stableStringify(run?.comparison?.scope || {});
    }

    function comparisonMethodRows(compatibleRuns, currentRun) {
      const rowsByMethod = new Map();
      for (const run of compatibleRuns) {
        for (const row of methodSummaryRows(run, currentRun)) {
          if (state.method !== 'all' && row.method !== state.method) continue;
          if (!rowsByMethod.has(row.method)) rowsByMethod.set(row.method, row);
        }
      }
      return [...rowsByMethod.values()].sort((left, right) => left.method.localeCompare(right.method));
    }

    function methodSummaryRows(run, currentRun = run) {
      const summaries = normalizedMethodSummaries(run)
        .filter((row) => state.method === 'all' || row.method === state.method);
      return summaries.map((row) => ({
        ...row,
        benchmark: run.benchmark_display_name || run.benchmark,
        model: run.resolved_model || run.model,
        run_id: run.run_id,
        source_run_id: run.run_id,
        source_path: run.path,
        source_is_current: Boolean(currentRun && run.path === currentRun.path),
        source_label: currentRun && run.path === currentRun.path ? 'source: current' : `source: reused ${run.run_id}`,
        route_breakdown: row.method === 'multiagent_dynamic_streaming' ? dynamicStreamingRouteBreakdown(run) : null,
        round_breakdown: row.method === 'dynamic_orchestration' ? dynamicOrchestrationRoundBreakdown(run) : null,
      }));
    }

    function dynamicStreamingRouteBreakdown(run) {
      const dynamicExamples = (run.examples || []).filter((example) => example.method === 'multiagent_dynamic_streaming');
      return {
        direct: routeStats(dynamicExamples, 'direct'),
        multi_agent: routeStats(dynamicExamples, 'multi_agent'),
      };
    }

    function dynamicOrchestrationRoundBreakdown(run) {
      const examples = (run.examples || []).filter((example) => example.method === 'dynamic_orchestration');
      const buckets = new Map();
      for (const example of examples) {
        const roundCount = dynamicOrchestrationRoundCount(example);
        const key = roundCount > 0 ? String(roundCount) : 'unknown';
        const bucket = buckets.get(key) || { key, label: roundCount > 0 ? `${roundCount} rounds` : 'unknown rounds', total: 0, correct: 0 };
        bucket.total += 1;
        if (example.correct === true || example.correct === 'True') bucket.correct += 1;
        buckets.set(key, bucket);
      }
      return [...buckets.values()]
        .sort((left, right) => {
          if (left.key === 'unknown') return 1;
          if (right.key === 'unknown') return -1;
          return Number(left.key) - Number(right.key);
        })
        .map((bucket) => ({
          ...bucket,
          accuracy: bucket.total ? bucket.correct / bucket.total : 0,
        }));
    }

    function dynamicOrchestrationRoundCount(example) {
      const trace = example.dynamic_orchestration && typeof example.dynamic_orchestration === 'object'
        ? example.dynamic_orchestration
        : null;
      if (!trace || !Array.isArray(trace.rounds)) return 0;
      return trace.rounds.length;
    }

    function routeStats(examples, routeMode) {
      const filtered = examples.filter((example) => example.route_mode === routeMode);
      const total = filtered.length;
      const correct = filtered.filter((example) => example.correct === true || example.correct === 'True').length;
      return {
        total,
        correct,
        accuracy: total ? correct / total : 0,
      };
    }

    function normalizedMethodSummaries(run) {
      const entries = Object.entries(run.summary || {});
      if (entries.length) {
        return entries.map(([method, stats]) => normalizeMethodSummary(method, stats));
      }
      return summarizeRowsByMethod(run.results || []);
    }

    function summarizeRowsByMethod(results) {
      const grouped = new Map();
      for (const row of results) {
        const method = String(row.method || '');
        if (!method) continue;
        const bucket = grouped.get(method) || [];
        bucket.push(row);
        grouped.set(method, bucket);
      }
      return [...grouped.entries()].map(([method, rows]) => {
        const total = rows.length;
        const correct = rows.filter((row) => row.correct === true || row.correct === 'True').length;
        const invalid = rows.filter((row) => row.pred === null || row.pred === undefined || row.pred === '').length;
        const totalTokens = rows.reduce((sum, row) => sum + Number(row.total_tokens || 0), 0);
        return {
          method,
          total,
          correct,
          accuracy: total ? correct / total : 0,
          invalid,
          invalid_rate: total ? invalid / total : 0,
          avg_total_tokens: total ? totalTokens / total : 0,
        };
      });
    }

    function normalizeMethodSummary(method, stats) {
      const value = stats && typeof stats === 'object' ? stats : {};
      return {
        method,
        total: Number(value.total || 0),
        correct: Number(value.correct || 0),
        accuracy: Number(value.accuracy || 0),
        invalid: Number(value.invalid || 0),
        invalid_rate: Number(value.invalid_rate || 0),
        avg_total_tokens: Number(value.avg_total_tokens || 0),
      };
    }

    function percent(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${(number * 100).toFixed(1)}%` : 'n/a';
    }

    function barWidth(value, maxValue) {
      const number = Number(value);
      const max = Number(maxValue);
      if (!Number.isFinite(number) || !Number.isFinite(max) || max <= 0) return 0;
      return Math.max(0, Math.min(100, (number / max) * 100)).toFixed(2);
    }

    function stableStringify(value) {
      if (value === null || typeof value !== 'object') return JSON.stringify(value);
      if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
      return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableStringify(value[key])}`).join(',')}}`;
    }

    function renderRunAnalysisPanel() {
      const context = analysisSelectionContext();
      if (!context.benchmarks.length) {
        $('analysisPanel').innerHTML = '<div class="empty">No benchmark summary rows are available for analysis.</div>';
        return;
      }
      if (!context.run) {
        $('analysisPanel').innerHTML = renderAnalysisSelectors(context) + '<div class="empty">No run is available for the selected benchmark/model.</div>';
        return;
      }
      const methods = runMethods(context.run);
      const targetMethod = analysisTargetMethod(context.run);
      if (!targetMethod) {
        $('analysisPanel').innerHTML = renderAnalysisSelectors(context) + '<div class="empty">No method results are available for this run.</div>';
        return;
      }
      const baselineOptions = analysisBaselineOptions(context, targetMethod);
      const baselineMethods = selectedAnalysisBaselineMethods(baselineOptions);
      const baselineSources = analysisBaselineSources(context.compatible_runs, context.run, baselineMethods);
      if (state.page === 'analysis' && targetMethod === 'multiagent_dynamic_streaming') {
        scheduleAnalysisTraceLoad(context.run, targetMethod);
      }
      const rows = runAnalysisRows(context.run, targetMethod, baselineSources);
      const summary = analysisSummary(rows);
      const buckets = analysisBuckets();
      $('analysisPanel').innerHTML = `
        <div class="toolbar">
          <div>
            <h2>Run Analysis</h2>
            <div class="subtle">${esc(context.run.benchmark_display_name)} · current ${esc(context.run.run_id)} · selected baselines from other compatible runs</div>
          </div>
          <span class="pill">compatible runs: ${esc(context.compatible_runs.length)}</span>
        </div>
        ${renderAnalysisSelectors(context, methods, targetMethod, baselineOptions, baselineMethods, baselineSources)}
        <div class="analysis-summary">
          <div class="stat"><span class="subtle">Current correct / total</span><strong>${esc(summary.correct)} / ${esc(summary.total)}</strong></div>
          <div class="stat"><span class="subtle">Current accuracy</span><strong>${esc(percent(summary.accuracy))}</strong></div>
          <div class="stat"><span class="subtle">Baseline correct, current wrong</span><strong>${esc(summary.regressions)}</strong></div>
          <div class="stat"><span class="subtle">Invalid</span><strong>${esc(summary.invalid)}</strong></div>
        </div>
        ${renderErrorDistributionChart(rows)}
        ${renderConsensusTrendChart(rows)}
        ${renderAnalysisTraceLoadingNotice(context.run, targetMethod)}
        ${renderSharedFindingImpactChart(rows, targetMethod)}
        ${buckets.map((bucket) => renderAnalysisBucket(bucket, rows.filter((row) => row.bucket === bucket.key))).join('')}
      `;
    }

    function analysisSelectionContext() {
      const runs = state.data.runs.filter((run) => !isExcludedAccuracyRun(run));
      const benchmarks = latestBenchmarksForAnalysis(runs);
      const benchmark = selectedAnalysisBenchmark(benchmarks);
      const benchmarkRuns = runs.filter((run) => run.benchmark === benchmark);
      const models = latestModelsForBenchmark(benchmarkRuns);
      const selectedModel = selectedAnalysisModel(benchmark, models);
      const modelRuns = analysisRunsForModel(benchmarkRuns, selectedModel);
      const run = selectedAnalysisRun(benchmark, selectedModel, modelRuns);
      const compatibleRuns = run ? compatibleAccuracyRuns(benchmarkRuns, selectedModel, run) : [];
