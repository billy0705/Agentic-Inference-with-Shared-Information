      const previousRun = run ? compatibleRuns.find((candidate) => candidate.path !== run.path) || null : null;
      return { benchmarks, benchmark, benchmark_runs: benchmarkRuns, models, selected_model: selectedModel, model_runs: modelRuns, run, compatible_runs: compatibleRuns, previous_run: previousRun };
    }

    function latestBenchmarksForAnalysis(runs) {
      const latestByBenchmark = new Map();
      for (const run of runs) {
        const current = latestByBenchmark.get(run.benchmark);
        if (!current || compareRunRecency(run, current) > 0) latestByBenchmark.set(run.benchmark, run);
      }
      return [...latestByBenchmark.entries()]
        .sort(([, leftRun], [, rightRun]) => compareRunRecency(rightRun, leftRun))
        .map(([benchmark]) => benchmark);
    }

    function selectedAnalysisBenchmark(benchmarks) {
      if (state.analysisBenchmark && benchmarks.includes(state.analysisBenchmark)) return state.analysisBenchmark;
      if (state.benchmark !== 'all' && benchmarks.includes(state.benchmark)) {
        state.analysisBenchmark = state.benchmark;
        return state.analysisBenchmark;
      }
      state.analysisBenchmark = benchmarks[0] || '';
      return state.analysisBenchmark;
    }

    function selectedAnalysisModel(benchmark, models) {
      const selected = state.analysisModels[benchmark];
      if (selected && models.includes(selected)) return selected;
      const fallback = state.model !== 'all' && models.includes(state.model) ? state.model : models[0] || '';
      if (fallback) state.analysisModels[benchmark] = fallback;
      return fallback;
    }

    function analysisRunsForModel(runs, model) {
      return runs
        .filter((run) => accuracyModelName(run) === model)
        .sort((left, right) => compareRunRecency(right, left));
    }

    function analysisRunSelectionKey(benchmark, model) {
      return `${benchmark}\n${model}`;
    }

    function selectedAnalysisRun(benchmark, model, modelRuns) {
      const key = analysisRunSelectionKey(benchmark, model);
      const selected = state.analysisRuns[key];
      if (selected) {
        const run = modelRuns.find((candidate) => candidate.path === selected);
        if (run) return run;
      }
      const fallback = modelRuns[0] || null;
      if (fallback) state.analysisRuns[key] = fallback.path;
      return fallback;
    }

    function analysisBaselineOptions(context, targetMethod) {
      const otherRuns = (context.compatible_runs || []).filter((run) => run.path !== context.run?.path);
      return unique(otherRuns.flatMap((run) => runMethods(run))).filter((method) => method !== targetMethod);
    }

    function selectedAnalysisBaselineMethods(options) {
      const selected = state.analysisBaselineMethods.filter((method) => options.includes(method));
      if (selected.length) return selected;
      const defaults = BASELINE_METHOD_DEFAULTS.filter((method) => options.includes(method));
      state.analysisBaselineMethods = defaults.length ? defaults : options.slice(0, 3);
      return state.analysisBaselineMethods;
    }

    function analysisBaselineSources(compatibleRuns, currentRun, baselineMethods) {
      const sources = new Map();
      const otherRuns = (compatibleRuns || []).filter((run) => run.path !== currentRun?.path);
      for (const method of baselineMethods) {
        const sourceRun = otherRuns.find((run) => runMethods(run).includes(method));
        if (sourceRun) sources.set(method, sourceRun);
      }
      return sources;
    }

    function renderAnalysisSelectors(context, methods = [], targetMethod = '', baselineOptions = [], baselineMethods = [], baselineSources = new Map()) {
      return `
        <div class="analysis-controls">
          <div class="field">
            <label for="analysisBenchmarkSelect">Benchmark</label>
            <select id="analysisBenchmarkSelect" onchange="setAnalysisBenchmark(this.value)">
              ${context.benchmarks.map((benchmark) => `<option value="${esc(benchmark)}" ${benchmark === context.benchmark ? 'selected' : ''}>${esc(benchmark)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="analysisModelSelect">Model</label>
            <select id="analysisModelSelect" onchange="setAnalysisModel(this.value)">
              ${context.models.map((model) => `<option value="${esc(model)}" ${model === context.selected_model ? 'selected' : ''}>${esc(model)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="analysisRunSelect">Run</label>
            <select id="analysisRunSelect" onchange="setAnalysisRun(this.value)">
              ${(context.model_runs || []).map((run) => `<option value="${esc(run.path)}" ${run.path === context.run?.path ? 'selected' : ''}>${esc(analysisRunLabel(run))}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="analysisMethodSelect">Analysis method</label>
            <select id="analysisMethodSelect" onchange="setAnalysisMethod(this.value)">
              ${methods.map((method) => `<option value="${esc(method)}" ${method === targetMethod ? 'selected' : ''}>${esc(method)}</option>`).join('')}
            </select>
          </div>
          <div class="field analysis-baselines">
            <label>Baseline methods</label>
            ${renderAnalysisBaselineControls(baselineOptions, baselineMethods)}
          </div>
        </div>
        <p class="subtle">
          Current source: ${esc(context.run?.path || 'n/a')}<br>
          Baseline sources: ${esc(formatBaselineSources(baselineMethods, baselineSources))}
        </p>
      `;
    }

    function analysisRunLabel(run) {
      const methods = runMethods(run);
      const total = run.results?.length || run.examples?.length || 0;
      return `${run.run_id} · ${methods.length} methods · ${total} rows`;
    }

    function renderAnalysisBaselineControls(options, selectedMethods) {
      if (!options.length) return '<div class="empty">No other compatible baseline methods are available for this benchmark/model/run.</div>';
      return `
        <div class="checkbox-group">
          ${options.map((method) => `
            <label class="check-pill">
              <input type="checkbox" ${selectedMethods.includes(method) ? 'checked' : ''} onchange="setAnalysisBaselineMethod('${esc(jsString(method))}', this.checked)">
              ${esc(method)}
            </label>
          `).join('')}
        </div>
      `;
    }

    function formatBaselineSources(baselineMethods, baselineSources) {
      const rows = baselineMethods.map((method) => {
        const source = baselineSources.get(method);
        return source ? `${method} -> ${source.run_id}` : `${method} -> missing`;
      });
      return rows.join('; ') || 'none';
    }

    function analysisTargetMethod(run) {
      const methods = runMethods(run);
      if (methods.includes(state.analysisMethod)) return state.analysisMethod;
      if (methods.includes('multiagent_dynamic_streaming')) {
        state.analysisMethod = 'multiagent_dynamic_streaming';
        return state.analysisMethod;
      }
      state.analysisMethod = methods[0] || '';
      return state.analysisMethod;
    }

    function setAnalysisMethod(method) {
      state.analysisMethod = method;
      state.analysisTraceLoadingKey = '';
      state.analysisTraceLoadProgress = null;
      state.page = 'analysis';
      render();
    }

    function setAnalysisBaselineMethod(method, checked) {
      const current = new Set(state.analysisBaselineMethods);
      if (checked) current.add(method);
      else current.delete(method);
      state.analysisBaselineMethods = [...current];
      state.page = 'analysis';
      render();
    }

    function setAnalysisBenchmark(benchmark) {
      state.analysisBenchmark = benchmark;
      state.analysisMethod = 'multiagent_dynamic_streaming';
      state.analysisBaselineMethods = [];
      state.analysisTraceLoadingKey = '';
      state.analysisTraceLoadProgress = null;
      state.page = 'analysis';
      render();
    }

    function setAnalysisModel(model) {
      if (state.analysisBenchmark) state.analysisModels[state.analysisBenchmark] = model;
      state.analysisMethod = 'multiagent_dynamic_streaming';
      state.analysisBaselineMethods = [];
      state.analysisTraceLoadingKey = '';
      state.analysisTraceLoadProgress = null;
      state.page = 'analysis';
      render();
    }

    function setAnalysisRun(path) {
      const context = analysisSelectionContext();
      if (context.benchmark && context.selected_model) {
        state.analysisRuns[analysisRunSelectionKey(context.benchmark, context.selected_model)] = path;
      }
      state.analysisBaselineMethods = [];
      state.analysisTraceLoadingKey = '';
      state.analysisTraceLoadProgress = null;
      state.page = 'analysis';
      render();
    }

    function analysisBuckets() {
      return [
        { key: 'current_wrong_baseline_correct', label: 'baseline correct, current wrong', tone: 'bad' },
        { key: 'invalid', label: 'invalid / extraction issue', tone: 'warn' },
        { key: 'current_wrong_baseline_wrong', label: 'current wrong, selected baselines wrong or missing', tone: 'bad' },
        { key: 'current_correct_baseline_wrong', label: 'current correct, selected baselines wrong', tone: 'good' },
        { key: 'current_correct_baseline_correct', label: 'current correct, selected baseline also correct', tone: 'good' },
      ];
    }

    function runAnalysisRows(run, targetMethod, baselineSources) {
      return questionResultRows(run).map((row) => {
        const target = row.methods[targetMethod];
        if (!target) return null;
        const baselineExamples = analysisBaselineExamples(row.index, baselineSources);
        const roundRows = analysisRoundRows(target);
        const decisionShift = analysisDecisionShift(roundRows);
        const consensus = analysisConsensusTrend(roundRows);
        const issue = classifyAnalysisIssue(target, baselineExamples);
        const failureExplanation = buildFailureExplanation(target, baselineExamples, roundRows, issue);
        const sharedFindingAnalysis = targetMethod === 'multiagent_dynamic_streaming'
          ? analyzeSharedFindings(target)
          : null;
        return {
          index: row.index,
          target_method: targetMethod,
          example: target,
          baseline_examples: baselineExamples,
          correct_baselines: baselineExamples.filter((item) => isCorrectExample(item.example)).map((item) => item.method),
          bucket: analysisBucketForExample(target, baselineExamples),
          issue,
          failure_explanation: failureExplanation,
          round_rows: roundRows,
          decision_shift: decisionShift,
          consensus,
          shared_finding_analysis: sharedFindingAnalysis,
        };
      }).filter(Boolean);
    }

    function analysisBaselineExamples(index, baselineSources) {
      return [...baselineSources.entries()].map(([method, sourceRun]) => ({
        method,
        source_run_id: sourceRun.run_id,
        source_path: sourceRun.path,
        example: findExampleByIndexAndMethod(sourceRun, index, method),
      })).filter((item) => item.example);
    }

    function findExampleByIndexAndMethod(run, index, method) {
      if (!run) return null;
      return (run.examples || []).find((example) => String(example.index) === String(index) && example.method === method) || null;
    }

    function analysisBucketForExample(example, baselineExamples) {
      if (isInvalidExample(example)) return 'invalid';
      const baselineCorrect = baselineExamples.some((item) => isCorrectExample(item.example));
      if (isCorrectExample(example)) {
        return baselineCorrect ? 'current_correct_baseline_correct' : 'current_correct_baseline_wrong';
      }
      return baselineCorrect ? 'current_wrong_baseline_correct' : 'current_wrong_baseline_wrong';
    }

    function classifyAnalysisIssue(example, baselineExamples) {
      if (isInvalidExample(example)) return 'invalid/extraction';
      const baselineCorrect = baselineExamples.some((item) => isCorrectExample(item.example));
      if (isCorrectExample(example)) {
        return baselineCorrect ? 'correct' : 'current fixed selected baseline error';
      }
      if (example.route_mode === 'direct') return 'direct route wrong';

      const aggregation = example.candidate_aggregation || {};
      const selected = aggregation.selected_candidate;
      const selectionRule = String(aggregation.selection_rule || '');
      const acceptedAnswers = acceptedAnswersForExample(example);
      const selectedMatchesGold = selected !== null && selected !== undefined && answerMatches(selected, example.gold, acceptedAnswers);
      if (selectedMatchesGold && !answerMatches(example.pred, example.gold, acceptedAnswers)) {
        return 'summarizer overrode correct aggregation';
      }
      if (selected !== null && selected !== undefined && !answerMatches(selected, example.gold, acceptedAnswers)) {
        return selectionRule === 'majority_vote' || selectionRule === 'unanimous_single_candidate'
          ? 'wrong subagent consensus'
          : 'wrong tie-break / final selection';
      }
      if (selectionRule === 'tie_requires_role_aware_synthesis') return 'no majority, summarizer wrong';
      if (baselineCorrect) return 'selected baseline correct';
      return 'method answer wrong';
    }

    function isCorrectExample(example) {
      return example?.correct === true || example?.correct === 'True';
    }

    function isInvalidExample(example) {
      return Boolean(example?.error) || example?.pred === null || example?.pred === undefined || example?.pred === '';
    }

    function comparableAnswer(value) {
      return String(value ?? '')
        .trim()
        .replace(/^Final\s+Answer\s*:\s*/i, '')
        .replace(/^\\boxed\{(.+)\}$/i, '$1')
        .replace(/^\((.+)\)$/i, '$1')
        .trim()
        .toLowerCase();
    }

    function analysisSummary(rows) {
      const total = rows.length;
      const correct = rows.filter((row) => isCorrectExample(row.example)).length;
      const invalid = rows.filter((row) => isInvalidExample(row.example)).length;
      return {
        total,
        correct,
        regressions: rows.filter((row) => !isCorrectExample(row.example) && row.baseline_examples.some((item) => isCorrectExample(item.example))).length,
        invalid,
        accuracy: total ? correct / total : 0,
      };
    }

    function errorDistribution(rows) {
      const counts = new Map();
      for (const row of rows) {
        if (isCorrectExample(row.example)) continue;
        counts.set(row.issue, (counts.get(row.issue) || 0) + 1);
      }
      return [...counts.entries()].sort((left, right) => right[1] - left[1]).map(([label, count]) => ({ label, count }));
    }

    function renderErrorDistributionChart(rows) {
      const distribution = errorDistribution(rows);
      if (!distribution.length) return '<div class="analysis-bucket"><h3>Error distribution</h3><div class="empty">No current-method errors in this selection.</div></div>';
      const maxCount = Math.max(...distribution.map((row) => row.count), 1);
      return `
        <section class="analysis-bucket">
          <div class="toolbar">
            <div>
              <h3>Error distribution</h3>
              <div class="subtle">Counts current-method failures by the most likely trace-level cause.</div>
            </div>
            <span class="pill">${esc(distribution.reduce((sum, row) => sum + row.count, 0))} errors</span>
          </div>
          <div class="analysis-chart">
            ${distribution.map((row) => `
              <div class="chart-row">
                <strong>${esc(row.label)}</strong>
                <div class="chart-track"><div class="chart-fill" style="width: ${esc(barWidth(row.count, maxCount))}%"></div></div>
                <span>${esc(row.count)}</span>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderConsensusTrendChart(rows) {
      const roundStats = analysisRoundStats(rows);
      if (!roundStats.length) return '';
      const metric = selectedAnalysisRoundMetric();
      return `
        <section class="analysis-bucket">
          <div class="toolbar">
            <div>
              <h3>Round majority and agreement</h3>
              <div class="subtle">Shows when subagents already have a correct-answer majority and when they converge to one choice. Uses benchmark valid targets when available.</div>
            </div>
            <div class="field">
              <label for="analysisRoundMetricSelect">Round bar</label>
              <select id="analysisRoundMetricSelect" onchange="setAnalysisRoundMetric(this.value)">
                ${analysisRoundMetricOptions().map((option) => `<option value="${esc(option.key)}" ${option.key === metric.key ? 'selected' : ''}>${esc(option.label)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="analysis-chart">
            ${roundStats.map((row) => `
              <div class="chart-row">
                <strong>Round ${esc(row.round)}</strong>
                <div>
                  <div class="chart-track" title="${esc(metric.label)}"><div class="chart-fill" style="width: ${esc(barWidth(row[metric.key], row.total))}%"></div></div>
                  <div class="subtle">correct majority ${esc(row.correct_majority)}/${esc(row.total)} · same choice ${esc(row.same_choice)}/${esc(row.total)} · same correct choice ${esc(row.same_correct_choice)}/${esc(row.total)}</div>
                </div>
                <span>${esc(percent(row.total ? row[metric.key] / row.total : 0))}</span>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderSharedFindingImpactChart(rows, targetMethod) {
      if (targetMethod !== 'multiagent_dynamic_streaming') return '';
      const stats = sharedFindingImpactSummary(rows);
      if (!stats.published_total && !stats.receiving_opportunities) return '';
      const categoryRows = [...stats.categories.entries()]
        .map(([category, row]) => ({ category, ...row }))
        .sort((left, right) => right.published - left.published || right.changed - left.changed || left.category.localeCompare(right.category));
      return `
        <section class="analysis-bucket">
          <div class="toolbar">
            <div>
              <h3>Shared findings impact</h3>
              <div class="subtle">Only for multiagent_dynamic_streaming. Categories are rule-based from shared finding text; changes are counted when an agent receives shared findings and changes its answer on the next recorded step.</div>
            </div>
            <span class="pill">${esc(stats.published_total)} shared findings</span>
          </div>
          <div class="analysis-summary">
            <div class="stat"><span class="subtle">Receiving opportunities</span><strong>${esc(stats.receiving_opportunities)}</strong></div>
            <div class="stat"><span class="subtle">Changed after shared</span><strong>${esc(stats.changed_total)} / ${esc(stats.receiving_opportunities)}</strong></div>
            <div class="stat"><span class="subtle">wrong -> correct</span><strong>${esc(stats.changed_wrong_to_correct)}</strong></div>
            <div class="stat"><span class="subtle">correct -> wrong</span><strong>${esc(stats.changed_correct_to_wrong)}</strong></div>
            <div class="stat"><span class="subtle">wrong -> wrong</span><strong>${esc(stats.changed_wrong_to_wrong)}</strong></div>
            <div class="stat"><span class="subtle">correct -> correct</span><strong>${esc(stats.changed_correct_to_correct)}</strong></div>
          </div>
          <table class="round-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Shared</th>
                <th>Received steps</th>
                <th>Changed</th>
                <th>Change rate</th>
                <th>wrong -> correct</th>
                <th>correct -> wrong</th>
                <th>wrong -> wrong</th>
                <th>correct -> correct</th>
              </tr>
            </thead>
            <tbody>
              ${categoryRows.map((row) => `
                <tr>
                  <td><strong>${esc(row.category)}</strong></td>
                  <td>${esc(row.published)}</td>
                  <td>${esc(row.received)}</td>
                  <td>${esc(row.changed)}</td>
                  <td>${esc(percent(row.received ? row.changed / row.received : 0))}</td>
                  <td><span class="good">${esc(row.wrong_to_correct)}</span></td>
                  <td><span class="bad">${esc(row.correct_to_wrong)}</span></td>
                  <td><span class="warn">${esc(row.wrong_to_wrong)}</span></td>
                  <td><span class="good">${esc(row.correct_to_correct)}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>
      `;
    }

    function renderAnalysisTraceLoadingNotice(run, targetMethod) {
      if (targetMethod !== 'multiagent_dynamic_streaming') return '';
      const methodExamples = (run?.examples || []).filter((example) => example.method === targetMethod);
      const unloadedCount = unloadedAnalysisTraceExamples(run, targetMethod).length;
      if (!unloadedCount) return '';
      const key = analysisTraceLoadKey(run, targetMethod);
      const progress = state.analysisTraceLoadProgress?.key === key ? state.analysisTraceLoadProgress : null;
      const loadedCount = progress ? progress.loaded : Math.max(0, methodExamples.length - unloadedCount);
      return `
        <section class="analysis-bucket">
          <div class="toolbar">
            <div>
              <h3>Loading shared finding traces</h3>
              <div class="subtle">Shared findings impact needs the full dynamic-streaming trace for each example. The panel will update after those traces finish loading.</div>
            </div>
            <span class="pill">${esc(loadedCount)} / ${esc(methodExamples.length)} loaded</span>
          </div>
        </section>
      `;
    }

    function sharedFindingImpactSummary(rows) {
      const categories = new Map();
      const ensureCategory = (category) => {
        if (!categories.has(category)) {
          categories.set(category, {
            published: 0,
            received: 0,
            changed: 0,
            wrong_to_correct: 0,
            correct_to_wrong: 0,
            wrong_to_wrong: 0,
            correct_to_correct: 0,
          });
        }
        return categories.get(category);
      };
      const stats = {
        published_total: 0,
        receiving_opportunities: 0,
        changed_total: 0,
        changed_wrong_to_correct: 0,
        changed_correct_to_wrong: 0,
        changed_wrong_to_wrong: 0,
        changed_correct_to_correct: 0,
        categories,
      };
      for (const row of rows) {
        const analysis = row.shared_finding_analysis;
        if (!analysis) continue;
        stats.published_total += analysis.published_findings.length;
        stats.receiving_opportunities += analysis.receiving_opportunities;
        stats.changed_total += analysis.answer_changes.length;
        stats.changed_wrong_to_correct += countSharedFindingOutcome(analysis.answer_changes, 'wrong_to_correct');
        stats.changed_correct_to_wrong += countSharedFindingOutcome(analysis.answer_changes, 'correct_to_wrong');
        stats.changed_wrong_to_wrong += countSharedFindingOutcome(analysis.answer_changes, 'wrong_to_wrong');
        stats.changed_correct_to_correct += countSharedFindingOutcome(analysis.answer_changes, 'correct_to_correct');
        for (const finding of analysis.published_findings) ensureCategory(finding.category).published += 1;
        for (const opportunity of analysis.receiving_steps) {
          for (const category of opportunity.categories) ensureCategory(category).received += 1;
        }
        for (const change of analysis.answer_changes) {
          for (const category of change.categories) {
            const bucket = ensureCategory(category);
            bucket.changed += 1;
            if (change.outcome_key === 'wrong_to_correct') bucket.wrong_to_correct += 1;
            if (change.outcome_key === 'correct_to_wrong') bucket.correct_to_wrong += 1;
            if (change.outcome_key === 'wrong_to_wrong') bucket.wrong_to_wrong += 1;
            if (change.outcome_key === 'correct_to_correct') bucket.correct_to_correct += 1;
          }
        }
      }
      return stats;
    }

    function countSharedFindingOutcome(changes, outcomeKey) {
      return (changes || []).filter((change) => change.outcome_key === outcomeKey).length;
    }

    function analysisRoundMetricOptions() {
      return [
        { key: 'correct_majority', label: 'Correct majority' },
        { key: 'same_choice', label: 'Same choice' },
        { key: 'same_correct_choice', label: 'Same correct choice' },
      ];
    }

    function selectedAnalysisRoundMetric() {
      const options = analysisRoundMetricOptions();
      return options.find((option) => option.key === state.analysisRoundMetric) || options[0];
    }

    function setAnalysisRoundMetric(metric) {
      state.analysisRoundMetric = metric;
      state.page = 'analysis';
      render();
    }

    function analysisRoundStats(rows) {
      const byRound = new Map();
      for (const row of rows) {
        for (const roundRow of row.round_rows || []) {
          if (!analysisRoundIsVisible(roundRow)) continue;
          const key = String(roundRow.round);
          const bucket = byRound.get(key) || { round: key, total: 0, correct_majority: 0, same_choice: 0, same_correct_choice: 0 };
          bucket.total += 1;
          if (roundRow.correct_majority) bucket.correct_majority += 1;
          if (roundRow.all_same_choice) bucket.same_choice += 1;
          if (roundRow.same_correct_choice) bucket.same_correct_choice += 1;
          byRound.set(key, bucket);
        }
      }
      return [...byRound.values()].sort((left, right) => compareExampleIndex(left.round, right.round));
    }

    function renderAnalysisBucket(bucket, rows) {
      return `
        <section class="analysis-bucket">
          <div class="toolbar">
            <div>
              <h3 class="${esc(bucket.tone)}">${esc(bucket.label)}</h3>
              <div class="subtle">${esc(analysisBucketDescription(bucket.key))}</div>
            </div>
            <span class="pill">${esc(rows.length)} examples</span>
          </div>
          <div class="analysis-list">
            ${rows.length ? rows.map(renderAnalysisIssueRow).join('') : '<div class="empty">No examples in this bucket.</div>'}
          </div>
        </section>
      `;
    }

    function analysisBucketDescription(key) {
      const descriptions = {
        current_wrong_baseline_correct: 'Error analysis focus: examples where our current method failed but at least one selected baseline method succeeded.',
        invalid: 'Missing predictions, extraction failures, or recorded errors.',
        current_wrong_baseline_wrong: 'Hard cases where the current method failed and no selected baseline method succeeded.',
        current_correct_baseline_wrong: 'Cases where the current method fixed failures from all selected baseline methods.',
        current_correct_baseline_correct: 'Cases where both current and at least one selected baseline method are correct.',
      };
      return descriptions[key] || '';
    }

    function renderAnalysisIssueRow(row) {
      const example = row.example;
      const aggregation = example.candidate_aggregation || {};
      const candidates = Array.isArray(aggregation.candidates) ? aggregation.candidates : [];
      return `
        <div class="analysis-row">
          <div class="analysis-row-header">
            <div>
              <strong>#${esc(row.index)}</strong>
              <span class="pill ${isCorrectExample(example) ? 'good' : isInvalidExample(example) ? 'warn' : 'bad'}">${esc(row.issue)}</span>
            </div>
            <button class="analysis-jump" type="button" onclick="selectExampleByIndexAndMethod('${esc(jsString(row.index))}', '${esc(jsString(row.target_method))}')">Open trace</button>
          </div>
          <div class="analysis-row-meta">
            <span class="pill">current pred: ${esc(example.pred)}</span>
            <span class="pill">gold: ${esc(example.gold)}</span>
            <span class="pill">correct baselines: ${esc(row.correct_baselines.join(', ') || 'none')}</span>
            <span class="pill">route: ${esc(example.route_mode || 'n/a')}</span>
            <span class="pill">aggregation: ${esc(aggregation.selection_rule || 'n/a')}</span>
            <span class="pill">selected: ${esc(aggregation.selected_candidate ?? 'n/a')}</span>
            <span class="pill">counts: ${esc(pretty(aggregation.counts || {}))}</span>
          </div>
          ${renderDecisionShift(row)}
          ${renderFailureExplanation(row)}
          ${renderSharedFindingDetails(row)}
          ${renderBaselineExampleDetails(row.baseline_examples)}
          ${renderRoundAnalysisTable(row.round_rows)}
          ${candidates.length ? `<details><summary>Agent candidates</summary><pre>${esc(pretty(candidates.map(compactAnalysisCandidate)))}</pre></details>` : ''}
          ${example.summarizer_final_answer || example.summarizer_raw_response ? `<details><summary>Summarizer output</summary><pre>${esc(truncateText(example.summarizer_final_answer || example.summarizer_raw_response, 6000))}</pre></details>` : ''}
        </div>
      `;
    }

    function renderFailureExplanation(row) {
      const explanation = row.failure_explanation;
      if (!explanation || !explanation.should_render) return '';
      return `
        <details class="mini-panel" open>
          <summary>Why our method failed</summary>
          <div class="analysis-row-meta">
            <span class="pill">baseline correct: ${esc(explanation.correct_baselines.join(', ') || 'none')}</span>
            <span class="pill">subagent choices: ${esc(explanation.choice_summary || 'n/a')}</span>
            <span class="pill">correct subagents: ${esc(explanation.correct_subagents.join(', ') || 'none')}</span>
            <span class="pill">final selected: ${esc(explanation.final_selected ?? 'n/a')}</span>
            <span class="pill">likely failure: ${esc(explanation.likely_failure)}</span>
          </div>
          ${explanation.wrong_rationales.length ? `
            <h4>Why wrong subagents did not choose gold</h4>
            <div class="analysis-list">
              ${explanation.wrong_rationales.map((item) => `
                <div class="mini-panel">
                  <strong>${esc(item.agent)}</strong>
                  <p>
                    <span class="pill">chose: ${esc(item.candidate)}</span>
                    <span class="pill">gold: ${esc(explanation.gold)}</span>
                    <span class="pill">round: ${esc(item.round)}</span>
                  </p>
                  <div class="subtle">${esc(item.rationale || 'No rationale excerpt was recorded for this candidate.')}</div>
                </div>
              `).join('')}
            </div>
          ` : '<div class="subtle">No wrong subagent rationale was available in the trace.</div>'}
        </details>
      `;
    }

    function renderSharedFindingDetails(row) {
      const analysis = row.shared_finding_analysis;
      if (!analysis) return '';
      const openAttr = isCorrectExample(row.example) ? '' : ' open';
      const findings = analysis.published_findings;
      const changes = analysis.answer_changes;
      return `
        <details class="mini-panel"${openAttr}>
          <summary>Shared findings details</summary>
          <div class="analysis-row-meta">
            <span class="pill">shared findings: ${esc(findings.length)}</span>
            <span class="pill">received steps: ${esc(analysis.receiving_opportunities)}</span>
            <span class="pill">changed after shared: ${esc(changes.length)}</span>
            <span class="pill">wrong -> correct: ${esc(countSharedFindingOutcome(changes, 'wrong_to_correct'))}</span>
            <span class="pill">correct -> wrong: ${esc(countSharedFindingOutcome(changes, 'correct_to_wrong'))}</span>
            <span class="pill">wrong -> wrong: ${esc(countSharedFindingOutcome(changes, 'wrong_to_wrong'))}</span>
            <span class="pill">correct -> correct: ${esc(countSharedFindingOutcome(changes, 'correct_to_correct'))}</span>
          </div>
          ${findings.length ? `
            <h4>What agents shared</h4>
            <table class="round-table">
              <thead>
                <tr>
                  <th>Step</th>
                  <th>Agent</th>
                  <th>Category</th>
                  <th>Choice</th>
                  <th>Shared finding</th>
                </tr>
              </thead>
              <tbody>
                ${findings.map((finding) => `
                  <tr>
                    <td>${esc(finding.step)}</td>
                    <td>${esc(finding.agent)}</td>
                    <td>${esc(finding.category)}</td>
                    <td>${esc(finding.choice || 'n/a')}</td>
                    <td class="shared-finding-text">${esc(truncateInline(finding.text, 360))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<div class="subtle">No SHARE_FINDING text was recorded for this example.</div>'}
          ${changes.length ? `
            <h4>Answer changes after receiving shared findings</h4>
            <table class="round-table">
              <thead>
                <tr>
                  <th>Step</th>
                  <th>Agent</th>
                  <th>Change</th>
                  <th>Outcome</th>
                  <th>Received categories</th>
                  <th>Received from</th>
                </tr>
              </thead>
              <tbody>
                ${changes.map((change) => `
                  <tr>
                    <td>${esc(change.step)}</td>
                    <td>${esc(change.agent)}</td>
                    <td>${esc(change.from)} -> ${esc(change.to)}</td>
                    <td><span class="${esc(sharedFindingOutcomeClass(change.outcome_key))}">${esc(change.outcome)}</span></td>
                    <td>${esc(change.categories.join(', ') || 'n/a')}</td>
                    <td class="shared-finding-text">${esc(formatIncomingFindings(change.incoming))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<div class="subtle">No answer changes were detected immediately after receiving shared findings.</div>'}
        </details>
      `;
    }

    function sharedFindingOutcomeClass(outcomeKey) {
      if (outcomeKey === 'wrong_to_correct' || outcomeKey === 'correct_to_correct') return 'good';
      if (outcomeKey === 'correct_to_wrong') return 'bad';
      if (outcomeKey === 'wrong_to_wrong') return 'warn';
      return '';
    }

    function formatIncomingFindings(incoming) {
      return (incoming || []).slice(0, 3).map((event) => {
        const source = event.source || 'unknown';
        return `${source}: ${truncateInline(event.text, 160)}`;
      }).join(' | ') || 'n/a';
    }

    function renderBaselineExampleDetails(baselineExamples) {
      if (!baselineExamples.length) return '<div class="subtle">Selected baseline details: none available for this question id.</div>';
      return `
        <details>
          <summary>Selected baseline details</summary>
          <div class="analysis-row-meta">
            ${baselineExamples.map((item) => `
              <span class="pill ${isCorrectExample(item.example) ? 'good' : 'bad'}">
                ${esc(item.method)}: ${esc(resultStatus(item.example).label)} · pred ${esc(item.example.pred)} · run ${esc(item.source_run_id)}
              </span>
            `).join('')}
          </div>
        </details>
      `;
    }

    function buildFailureExplanation(example, baselineExamples, roundRows, issue) {
      const correctBaselines = baselineExamples.filter((item) => isCorrectExample(item.example)).map((item) => item.method);
      const shouldRender = !isCorrectExample(example) && correctBaselines.length > 0;
      const finalRound = roundRows.at(-1) || {};
      const finalSelected = finalRound.selected_candidate ?? example.pred ?? null;
      const acceptedAnswers = acceptedAnswersForExample(example);
      const latestCandidates = latestAgentCandidates(roundRows);
      const wrongRationales = latestCandidates
        .filter((candidate) => !answerMatches(candidate.candidate, example.gold, acceptedAnswers))
        .map((candidate) => ({
          agent: candidate.agent_name || 'unknown',
          candidate: candidate.candidate,
          round: candidate.round ?? 'n/a',
          rationale: candidateRationale(candidate),
        }));
      const correctSubagents = unique(latestCandidates
        .filter((candidate) => answerMatches(candidate.candidate, example.gold, acceptedAnswers))
        .map((candidate) => candidate.agent_name || 'unknown'));
      return {
        should_render: shouldRender,
        correct_baselines: correctBaselines,
        choice_summary: formatChoiceSummary(finalRound.counts || countCandidates(latestCandidates)),
        correct_subagents: correctSubagents,
        final_selected: finalSelected,
        likely_failure: likelyFailureReason(issue, finalRound, correctSubagents),
        wrong_rationales: wrongRationales,
        gold: formatAcceptedAnswers(example),
      };
    }

    function latestAgentCandidates(roundRows) {
      const latest = new Map();
      for (const roundRow of roundRows || []) {
        for (const candidate of roundRow.agent_candidates || []) {
          const agent = candidate.agent_name || 'unknown';
          latest.set(agent, { ...candidate, round: roundRow.round });
        }
      }
      return [...latest.values()];
    }

    function formatChoiceSummary(counts) {
      return Object.entries(counts || {})
        .sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]))
        .map(([candidate, count]) => `${candidate}=${count}`)
        .join(', ');
    }

    function candidateRationale(candidate) {
      return truncateInline(candidate.reason_excerpt || candidate.support_excerpt || candidate.summary || candidate.output || '', 280);
    }

    function likelyFailureReason(issue, finalRound, correctSubagents) {
      if (issue === 'wrong subagent consensus') {
        return correctSubagents.length
          ? 'wrong subagent consensus ignored a correct minority'
          : 'wrong subagent consensus; no subagent with an extracted candidate chose gold';
      }
      if (issue === 'wrong tie-break / final selection') {
        return correctSubagents.length
          ? 'tie-break or final selector did not use the correct subagent'
          : 'tie-break or final selector chose a wrong candidate';
      }
      if (issue === 'summarizer overrode correct aggregation') return 'summarizer overrode a correct aggregated candidate';
      if (issue === 'direct route wrong') return 'direct route skipped multi-agent correction';
      if (finalRound?.selected_correct === false) return 'final selected answer differs from gold';
      return issue || 'method failed while a selected baseline succeeded';
    }

    function renderDecisionShift(row) {
      const changed = row.decision_shift.changed_agents;
      const afterShared = row.decision_shift.after_shared_changes;
      const consensus = row.consensus;
      return `
        <div class="analysis-row-meta">
          <span class="pill">agents changed after shared info: ${esc(afterShared.length ? afterShared.map((item) => item.agent).join(', ') : 'none')}</span>
          <span class="pill">agents changed answer: ${esc(changed.length ? changed.map((item) => item.agent).join(', ') : 'none')}</span>
          <span class="pill">final agents all agree: ${esc(consensus.final_all_same ? 'yes' : 'no')}</span>
          <span class="pill">final agreement strength: ${esc(consensus.final_strength || 'n/a')}</span>
        </div>
      `;
    }

    function renderRoundAnalysisTable(roundRows) {
      if (!roundRows.length) {
        return '<div class="empty">No round-level candidate data available for this example.</div>';
      }
      return `
        <details open>
          <summary>Round-level answer analysis</summary>
          <table class="round-table">
            <thead>
              <tr>
                <th>Round</th>
                <th>Selected answer</th>
                <th>Majority</th>
                <th>Correct subagents</th>
                <th>Shared findings used</th>
                <th>Agreement</th>
                <th>Counts</th>
              </tr>
            </thead>
            <tbody>
              ${roundRows.map((roundRow) => `
                <tr>
                  <td>${esc(roundRow.round)}</td>
                  <td>${esc(roundRow.selected_candidate ?? 'n/a')}</td>
                  <td><span class="${roundRow.correct_majority ? 'good' : roundRow.has_majority ? 'bad' : 'warn'}">${esc(roundMajorityLabel(roundRow))}</span></td>
                  <td>${esc(roundRow.correct_subagents.join(', ') || 'none')}</td>
                  <td>${esc(roundRow.shared_agents.join(', ') || 'none')}</td>
                  <td>${esc(roundRow.consensus_strength || 'n/a')} · same choice: ${esc(roundRow.all_same_choice ? 'yes' : 'no')} · same correct: ${esc(roundRow.same_correct_choice ? 'yes' : 'no')}</td>
                  <td><code>${esc(pretty(roundRow.counts || {}))}</code></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </details>
      `;
    }

    function roundMajorityLabel(roundRow) {
      if (roundRow.correct_majority) return 'correct majority';
      if (roundRow.has_majority) return 'wrong majority';
      return 'no majority';
    }

    function compactAnalysisCandidate(candidate) {
      return {
        agent: candidate.agent_name,
        candidate: candidate.candidate,
        source: candidate.candidate_source,
        critical_debate: candidate.critical_debate,
        role: candidate.role,
        reason: candidate.reason_excerpt,
      };
    }

    function analyzeSharedFindings(example) {
      const acceptedAnswers = acceptedAnswersForExample(example);
      const publishedFindings = [];
      const receivingSteps = [];
      const answerChanges = [];
      for (const agent of example.agents || []) {
        let previousChoice = '';
        let previousCorrect = null;
        const steps = [...(agent.steps || [])].sort((left, right) => compareExampleIndex(left.step ?? 0, right.step ?? 0));
        for (const step of steps) {
          const stepNumber = step.step ?? '';
          const currentChoice = candidateFromStep(step);
          const currentCorrect = currentChoice ? answerMatches(currentChoice, example.gold, acceptedAnswers) : null;
          const shareText = sharedFindingTextFromStep(step);
          if (shareText) {
            publishedFindings.push({
              agent: agent.name,
              step: stepNumber,
              text: shareText,
              category: classifySharedFinding(shareText, firstSharedEventType(step.published_events)),
              choice: currentChoice,
            });
          }
          const incoming = sharedIncomingFindings(step);
          if (incoming.length && previousChoice && currentChoice) {
            const categories = unique(incoming.map((event) => event.category));
            receivingSteps.push({
              agent: agent.name,
              step: stepNumber,
              categories,
              incoming,
              from: previousChoice,
              to: currentChoice,
            });
            if (comparableAnswer(previousChoice) !== comparableAnswer(currentChoice)) {
              const outcome = sharedFindingChangeOutcome(previousCorrect, currentCorrect);
              answerChanges.push({
                agent: agent.name,
                step: stepNumber,
                from: previousChoice,
                to: currentChoice,
                categories,
                incoming,
                outcome: outcome.label,
                outcome_key: outcome.key,
              });
            }
          }
          if (currentChoice) {
            previousChoice = currentChoice;
            previousCorrect = currentCorrect;
          }
        }
      }
      return {
        published_findings: publishedFindings,
        receiving_steps: receivingSteps,
        receiving_opportunities: receivingSteps.length,
        answer_changes: answerChanges,
      };
    }

    function sharedFindingTextFromStep(step) {
      const parsed = step.parsed_output && typeof step.parsed_output === 'object' ? step.parsed_output : {};
      const parsedFinding = String(parsed.share_finding || '').trim();
      if (parsedFinding) return parsedFinding;
      const event = (step.published_events || []).find(isSharedFindingEvent);
      return String(event?.content || '').trim();
    }

    function firstSharedEventType(events) {
      const event = (events || []).find(isSharedFindingEvent);
      return event?.event_type || '';
    }

    function sharedIncomingFindings(step) {
      return (step.inbox_events || []).filter(isSharedFindingEvent).map((event) => {
        const text = String(event.content || '').trim();
        return {
          source: event.source || 'unknown',
          event_type: event.event_type || '',
          text,
          category: classifySharedFinding(text, event.event_type),
        };
      }).filter((event) => event.text);
    }

    function classifySharedFinding(text, eventType = '') {
      const lower = String(text || '').toLowerCase();
      if (!lower.trim() || lower.trim() === 'none' || lower.trim() === 'n/a') return 'no useful finding';
      if (eventType === 'critique') return 'correction / critique';
      if (/\b(eliminate|eliminates|ruled out|rule out|not option|not the answer|incorrect option|exclude)\b/i.test(lower)) return 'option elimination';
      if (/\b(however|but|challenge|contradict|incorrect|wrong|verify|check|critique|refute|pitfall)\b/i.test(lower)) return 'correction / critique';
      if (/\b(option|candidate|answer_choice|final answer|corresponds to|matches)\s*[:#-]?\s*[abcd]\b/i.test(lower) || /\b[abcd]\s+is\s+(the\s+)?(correct|best|most likely)/i.test(lower)) return 'answer recommendation';
      if (/\b(uncertain|ambiguous|may|might|likely|possible|depends|assumption)\b/i.test(lower)) return 'uncertainty / caveat';
      if (/[=+\-*/^<>~]|\\frac|\\times|\b(calculate|calculated|ratio|count|therefore|because|due to|implies|derived)\b/i.test(lower)) return 'evidence / calculation';
      return 'evidence / observation';
    }

    function sharedFindingChangeOutcome(previousCorrect, currentCorrect) {
      if (previousCorrect === false && currentCorrect === true) return { key: 'wrong_to_correct', label: 'wrong -> correct' };
      if (previousCorrect === true && currentCorrect === false) return { key: 'correct_to_wrong', label: 'correct -> wrong' };
      if (previousCorrect === false && currentCorrect === false) return { key: 'wrong_to_wrong', label: 'wrong -> wrong' };
      if (previousCorrect === true && currentCorrect === true) return { key: 'correct_to_correct', label: 'correct -> correct' };
      return { key: 'changed_unknown', label: 'changed' };
    }

    function analysisRoundRows(example) {
      const orchestrationRounds = example.dynamic_orchestration?.rounds;
      let rows = [];
      if (Array.isArray(orchestrationRounds) && orchestrationRounds.length) {
        rows = orchestrationRounds.map((round, index) => normalizeAnalysisRound(round, example, index));
      } else {
        rows = agentStepAnalysisRoundRows(example);
      }
      return rows.filter(analysisRoundIsVisible);
    }

    function analysisRoundIsVisible(roundRow) {
      const roundNumber = Number(roundRow.round);
      return !Number.isFinite(roundNumber) || roundNumber <= MAX_ANALYSIS_ROUNDS;
    }

    function normalizeAnalysisRound(round, example, index) {
      const aggregation = round.candidate_aggregation || round.candidate_aggregation_before || {};
      const decision = round.decision && typeof round.decision === 'object' ? round.decision : {};
      const decisionCandidate = candidateFromText(decision.final_answer || round.final_answer || '');
      const roundAggregation = {
        ...aggregation,
        selected_candidate: aggregation.selected_candidate ?? (decisionCandidate || null),
      };
      const agentCandidates = normalizedCandidateRows(aggregation, round);
      return buildAnalysisRoundRow({
        round: round.round ?? index + 1,
        aggregation: roundAggregation,
        agentCandidates,
        sharedAgents: sharedFindingAgentsFromRound(round),
        gold: example.gold,
        acceptedAnswers: acceptedAnswersForExample(example),
      });
    }

    function agentStepAnalysisRoundRows(example) {
      const rowsByStep = new Map();
      for (const agent of example.agents || []) {
        for (const step of agent.steps || []) {
          const stepNumber = step.step ?? 1;
          const row = rowsByStep.get(stepNumber) || { round: stepNumber, agentCandidates: [], sharedAgents: new Set() };
          const candidate = candidateFromStep(step) || candidateFromText(agent.final_output);
          if (candidate) {
            row.agentCandidates.push({
              agent_name: agent.name,
              candidate,
              candidate_source: 'agent_step',
              reason_excerpt: truncateInline(step.parsed_output?.summary || step.parsed_output?.output || step.raw_response || '', 280),
              summary: step.parsed_output?.summary || '',
              output: step.parsed_output?.output || step.raw_response || '',
            });
          }
          if ((step.inbox_events || []).some(isSharedFindingEvent)) row.sharedAgents.add(agent.name);
          rowsByStep.set(stepNumber, row);
        }
      }
      return [...rowsByStep.values()].sort((left, right) => compareExampleIndex(left.round, right.round)).map((row) => {
        const counts = countCandidates(row.agentCandidates);
        return buildAnalysisRoundRow({
          round: row.round,
          aggregation: {
            counts,
            selected_candidate: topCandidateFromCounts(counts),
            consensus_strength: consensusStrengthFromCounts(counts),
            selection_rule: 'agent_step_majority',
          },
          agentCandidates: row.agentCandidates,
          sharedAgents: [...row.sharedAgents],
          gold: example.gold,
          acceptedAnswers: acceptedAnswersForExample(example),
        });
      });
    }

    function buildAnalysisRoundRow({ round, aggregation, agentCandidates, sharedAgents, gold, acceptedAnswers = [] }) {
      const counts = Object.keys(aggregation.counts || {}).length ? aggregation.counts : countCandidates(agentCandidates);
      const topCandidate = topCandidateFromCounts(counts);
      const selectedCandidate = aggregation.selected_candidate ?? topCandidate;
      const candidateValues = agentCandidates.map((candidate) => comparableAnswer(candidate.candidate)).filter(Boolean);
      const uniqueCandidates = new Set(candidateValues);
      const countValues = Object.values(counts || {}).map(Number).filter((value) => value > 0);
      const choiceTotal = countValues.reduce((sum, value) => sum + value, 0);
      const topCount = topCandidate === null || topCandidate === undefined ? 0 : Number(counts[topCandidate] || 0);
      const hasMajority = choiceTotal > 0 && topCount > choiceTotal / 2;
      const correctMajority = hasMajority && answerMatches(topCandidate, gold, acceptedAnswers);
      const allSameChoice = Object.keys(counts || {}).filter((key) => Number(counts[key]) > 0).length === 1 && choiceTotal > 1;
      const correctSubagents = agentCandidates
        .filter((candidate) => answerMatches(candidate.candidate, gold, acceptedAnswers))
        .map((candidate) => candidate.agent_name || candidate.logical_agent_name || 'unknown');
      return {
        round,
        top_candidate: topCandidate,
        selected_candidate: selectedCandidate,
        selected_correct: selectedCandidate === null || selectedCandidate === undefined ? null : answerMatches(selectedCandidate, gold, acceptedAnswers),
        has_majority: hasMajority,
        correct_majority: correctMajority,
        consensus_strength: aggregation.consensus_strength || consensusStrengthFromCounts(aggregation.counts || {}),
        counts,
        correct_subagents: unique(correctSubagents),
        shared_agents: unique(sharedAgents || []),
        agent_candidates: agentCandidates,
        all_same_choice: allSameChoice || (uniqueCandidates.size === 1 && candidateValues.length > 1),
        same_correct_choice: (allSameChoice || (uniqueCandidates.size === 1 && candidateValues.length > 1)) && answerMatches(topCandidate, gold, acceptedAnswers),
      };
    }

    function normalizedCandidateRows(aggregation, round) {
      const rows = [];
      const seen = new Set();
      const addRow = (candidate, fallbackSource) => {
        if (!candidate || typeof candidate !== 'object') return;
        const agentName = candidate.agent_name || candidate.logical_agent_name || candidate.name || '';
        const value = candidate.candidate ?? candidate.selected_candidate ?? candidate.answer ?? null;
        if (value === null || value === undefined || value === '') return;
        const key = `${agentName}:${value}:${fallbackSource}`;
        if (seen.has(key)) return;
        seen.add(key);
        rows.push({
          agent_name: agentName || 'unknown',
          candidate: value,
          candidate_source: candidate.candidate_source || fallbackSource,
          critical_debate: candidate.critical_debate,
          role: candidate.role,
          reason_excerpt: candidate.reason_excerpt || candidate.support_excerpt || '',
          support_excerpt: candidate.support_excerpt || '',
          summary: candidate.summary || '',
          output: candidate.output || '',
        });
      };
      (Array.isArray(aggregation.candidates) ? aggregation.candidates : []).forEach((candidate) => addRow(candidate, 'candidate_aggregation'));
      (Array.isArray(aggregation.reporting_agents) ? aggregation.reporting_agents : []).forEach((candidate) => addRow(candidate, 'reporting_agent'));
      (Array.isArray(aggregation.supporting_agents) ? aggregation.supporting_agents : []).forEach((candidate) => addRow(candidate, 'supporting_agent'));
      (Array.isArray(round.reporting_agents) ? round.reporting_agents : []).forEach((candidate) => addRow(candidate, 'round_reporting_agent'));
      (Array.isArray(round.supporting_agents) ? round.supporting_agents : []).forEach((candidate) => addRow(candidate, 'round_supporting_agent'));
      return rows;
    }

    function sharedFindingAgentsFromRound(round) {
      const agents = new Set();
      const traces = round.agent_traces && typeof round.agent_traces === 'object' ? round.agent_traces : {};
      for (const [agentName, trace] of Object.entries(traces)) {
        const steps = Array.isArray(trace.steps) ? trace.steps : [];
        if (steps.some((step) => (step.inbox_events || []).some(isSharedFindingEvent))) agents.add(agentName);
        const receipts = Array.isArray(trace.event_receipts) ? trace.event_receipts : [];
        if (receipts.some((receipt) => receipt.accepted && isSharedFindingEvent(receipt))) agents.add(agentName);
      }
      return [...agents];
    }

    function isSharedFindingEvent(event) {
      return COMMUNICATION_EVENT_TYPES.includes(event?.event_type);
    }

    function candidateFromStep(step) {
      const parsed = step.parsed_output && typeof step.parsed_output === 'object' ? step.parsed_output : {};
      return parsed.parsed_answer ||
        parsed.answer_choice ||
        parsed.final_answer ||
        candidateFromText(parsed.local_notes) ||
        candidateFromText(parsed.summary) ||
        candidateFromText(parsed.output) ||
        candidateFromText(step.raw_response);
    }

    function candidateFromText(value) {
      const text = String(value ?? '');
      if (!text.trim()) return '';
      const answerChoice = text.match(/ANSWER_CHOICE\s*:\s*([^\n]+)/i);
      if (answerChoice) return cleanCandidate(answerChoice[1]);
      const finalAnswer = text.match(/Final\s+Answer\s*:\s*([^\n]+)/i);
      if (finalAnswer) return cleanCandidate(finalAnswer[1]);
      const boxed = text.match(/\\boxed\{([^}]+)\}/i);
      if (boxed) return cleanCandidate(boxed[1]);
      const parenthesized = text.match(/\(([A-Za-z][A-Za-z0-9_.-]{0,11})\)/);
      if (parenthesized) return cleanCandidate(parenthesized[1]);
      return '';
    }

    function cleanCandidate(value) {
      return String(value ?? '').replace(/^[("*\s]+|[)"*\s.]+$/g, '').trim();
    }

    function countCandidates(candidates) {
      const counts = {};
      for (const candidate of candidates || []) {
        const value = candidate?.candidate;
        if (value === null || value === undefined || value === '') continue;
        const key = String(value);
        counts[key] = (counts[key] || 0) + 1;
      }
      return counts;
    }

    function topCandidateFromCounts(counts) {
      const entries = Object.entries(counts || {}).sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]));
      return entries.length ? entries[0][0] : null;
    }

    function consensusStrengthFromCounts(counts) {
      const values = Object.values(counts || {}).map(Number).filter((value) => value > 0);
      if (!values.length) return 'no_candidate';
      if (values.length === 1) return 'unanimous';
      const total = values.reduce((sum, value) => sum + value, 0);
      const max = Math.max(...values);
      return max / total >= 0.67 ? 'strong_majority' : 'weak_or_tie';
    }

    function acceptedAnswersForExample(example) {
      const metadata = example?.score_metadata && typeof example.score_metadata === 'object' ? example.score_metadata : {};
      const validTargets = Array.isArray(metadata.valid_targets) ? metadata.valid_targets : [];
      const answers = validTargets.length ? validTargets : [example?.gold];
      return unique(answers.map(comparableAnswer).filter(Boolean));
    }

    function formatAcceptedAnswers(example) {
      const accepted = acceptedAnswersForExample(example);
      if (accepted.length <= 1) return accepted[0] || example?.gold || 'n/a';
      return `${accepted.slice(0, 8).join(', ')}${accepted.length > 8 ? `, +${accepted.length - 8} more` : ''}`;
    }

    function answerMatches(candidate, gold, acceptedAnswers = []) {
      if (candidate === null || candidate === undefined) return false;
      const normalizedCandidate = comparableAnswer(candidate);
      if (!normalizedCandidate) return false;
      if (acceptedAnswers.length) return acceptedAnswers.includes(normalizedCandidate);
      if (gold === null || gold === undefined || gold === '') return false;
      return normalizedCandidate === comparableAnswer(gold);
    }

    function analysisDecisionShift(roundRows) {
      const latestByAgent = new Map();
      const changedAgents = [];
      const afterSharedChanges = [];
      for (const roundRow of roundRows) {
        const sharedAgents = new Set(roundRow.shared_agents || []);
        for (const candidate of roundRow.agent_candidates || []) {
          const agent = candidate.agent_name || 'unknown';
          const value = comparableAnswer(candidate.candidate);
          if (!value) continue;
          const previous = latestByAgent.get(agent);
          if (previous && previous.value !== value) {
            const item = { agent, from: previous.raw, to: candidate.candidate, round: roundRow.round };
            changedAgents.push(item);
            if (sharedAgents.has(agent) || previous.shared) afterSharedChanges.push(item);
          }
          latestByAgent.set(agent, { value, raw: candidate.candidate, shared: sharedAgents.has(agent) });
        }
      }
      return { changed_agents: changedAgents, after_shared_changes: afterSharedChanges };
    }

    function analysisConsensusTrend(roundRows) {
      const finalRound = roundRows.at(-1) || {};
      const firstRound = roundRows[0] || {};
      const firstUnique = new Set((firstRound.agent_candidates || []).map((candidate) => comparableAnswer(candidate.candidate)).filter(Boolean)).size;
      const finalUnique = new Set((finalRound.agent_candidates || []).map((candidate) => comparableAnswer(candidate.candidate)).filter(Boolean)).size;
      return {
        final_all_same: Boolean(finalRound.all_same_choice),
        final_strength: finalRound.consensus_strength || '',
        improved: firstUnique > finalUnique && finalUnique > 0,
      };
    }

    function renderRunList(runs) {
      const active = currentRun();
      $('runList').innerHTML = runs.map((run) => `
        <button class="run-button ${active && active.path === run.path ? 'active' : ''}" type="button" data-run-path="${esc(run.path)}">
          <strong>${esc(run.run_id)}</strong>
          <div class="subtle">${esc(run.benchmark)} / ${esc(run.model)}</div>
          <div>${run.examples.length} examples · ${run.results.length} result rows</div>
        </button>
      `).join('') || '<div class="empty">No runs match the filters.</div>';
      document.querySelectorAll('[data-run-path]').forEach((button) => {
        button.addEventListener('click', () => {
          state.run = button.dataset.runPath;
          state.exampleIndex = 0;
          state.agent = 'all';
          state.eventAgent = 'all';
          state.eventType = 'communication';
          render();
        });
      });
    }

    function renderRunPanel(run) {
      if (!run) {
        $('runPanel').innerHTML = '<div class="empty">No run selected.</div>';
        return;
      }
      const methods = Object.entries(run.summary || {}).map(([method, item]) => `<span class="pill">${esc(method)} · acc ${round(item.accuracy)}</span>`).join('');
      $('runPanel').innerHTML = `
        <h2>${esc(run.benchmark_display_name)} · ${esc(run.run_id)}</h2>
        <div class="subtle">${esc(run.path)}</div>
        <p><span class="pill">${esc(run.model)}</span><span class="pill">${esc(run.resolved_model)}</span>${methods}</p>
        <details><summary>Run config</summary><pre>${esc(pretty(run.run_config))}</pre></details>
        <details><summary>Results CSV preview</summary><pre>${esc(pretty(run.csv_rows))}</pre></details>
      `;
    }

    function renderQuestionMatrix(run) {
      if (!run || !run.examples.length) {
        return '<div class="empty">No examples available for this run.</div>';
      }
      const rows = questionResultRows(run);
      const methods = runMethods(run);
      if (!rows.length || !methods.length) {
        return '<div class="empty">No method results are available for comparison.</div>';
      }
      const invalidLocations = questionInvalidLocations(rows, methods);
      return `
        <div class="toolbar">
          <div>
            <h2>Question Results</h2>
            <div class="subtle">Compare every method on the same question id. Click a cell to open that method trace for the selected id.</div>
          </div>
          <span class="pill">${esc(rows.length)} question ids</span>
        </div>
        ${renderInvalidLocations(invalidLocations)}
        <div class="matrix-wrap">
          <table class="question-matrix">
            <thead>
              <tr>
                <th>Question id</th>
                ${methods.map((method) => `<th>${esc(method)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  <td><strong>#${esc(row.index)}</strong></td>
                  ${methods.map((method) => renderQuestionResultCell(run, row, method)).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function questionResultRows(run) {
      const rowsByIndex = new Map();
      for (const example of run.examples || []) {
        const index = String(example.index ?? '');
        if (!index) continue;
        const row = rowsByIndex.get(index) || { index, methods: {} };
        row.methods[example.method] = example;
        rowsByIndex.set(index, row);
      }
      return [...rowsByIndex.values()].sort((left, right) => compareExampleIndex(left.index, right.index));
    }

    function questionInvalidLocations(rows, methods) {
      const invalid = [];
      for (const row of rows) {
        for (const method of methods) {
          const example = row.methods[method];
          if (example && resultStatus(example).kind === 'invalid') {
            invalid.push({ index: row.index, method });
          }
        }
      }
      return invalid;
    }

    function renderInvalidLocations(invalidLocations) {
      if (!invalidLocations.length) {
        return '<div class="subtle">Invalid locations: none</div>';
      }
      return `
        <details class="mini-panel" open>
          <summary>Invalid locations (${esc(invalidLocations.length)})</summary>
          <div class="invalid-locations">
            ${invalidLocations.map((invalid) => `
              <button class="invalid-location" type="button" onclick="selectExampleByIndexAndMethod('${esc(jsString(invalid.index))}', '${esc(jsString(invalid.method))}')">
                #${esc(invalid.index)} / ${esc(invalid.method)}
              </button>
            `).join('')}
          </div>
        </details>
      `;
    }

    function compareExampleIndex(left, right) {
      const leftNumber = Number(left);
      const rightNumber = Number(right);
      if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) return leftNumber - rightNumber;
      return String(left).localeCompare(String(right));
    }

    function renderQuestionResultCell(run, row, method) {
      const example = row.methods[method];
      if (!example) return '<td><span class="subtle">missing</span></td>';
      const status = resultStatus(example);
      const isActive = currentExample(run) === example;
      return `
        <td>
          <button class="result-cell compact ${esc(status.kind)} ${isActive ? 'active' : ''}" type="button" onclick="selectExampleByIndexAndMethod('${esc(jsString(row.index))}', '${esc(jsString(method))}')">
            <span class="status">${esc(status.label)}</span>
            ${example.error ? `<span class="result-meta">error: ${esc(truncateInline(example.error, 80))}</span>` : ''}
          </button>
        </td>
      `;
    }

    function resultStatus(example) {
      if (example.error) return { kind: 'error', label: 'ERROR' };
      if (example.correct === true || example.correct === 'True') return { kind: 'correct', label: 'OK' };
      if (example.pred === null || example.pred === undefined || example.pred === '') return { kind: 'invalid', label: 'INVALID' };
      return { kind: 'wrong', label: 'WRONG' };
    }

    function truncateInline(value, limit) {
      const text = String(value ?? '').replace(/\s+/g, ' ').trim();
      if (text.length <= limit) return text;
      return `${text.slice(0, Math.max(0, limit - 3)).trim()}...`;
    }

    function selectExampleByIndexAndMethod(index, method) {
      const run = currentRun();
      if (!run) return;
      const exampleIndex = run.examples.findIndex((example) => String(example.index) === String(index) && example.method === method);
      if (exampleIndex < 0) return;
      state.exampleIndex = exampleIndex;
      state.agent = 'all';
      state.eventAgent = 'all';
      state.eventType = 'communication';
      state.page = 'detail';
      render();
    }

    function renderExampleSelect(run) {
      if (!run || !run.examples.length) {
        $('exampleFilter').innerHTML = '<option>No examples</option>';
        $('exampleFilter').className = '';
        return;
      }
      $('exampleFilter').className = exampleSelectClass(currentExample(run));
      $('exampleFilter').innerHTML = run.examples.map((example, index) => {
        const status = example.correct === true || example.correct === 'True' ? 'correct' : 'wrong';
        return `<option class="example-status-${esc(status)}" value="${index}">#${esc(example.index)} ${esc(example.method)} · ${status}</option>`;
      }).join('');
      $('exampleFilter').value = String(Math.min(state.exampleIndex, run.examples.length - 1));
    }

    function exampleSelectClass(example) {
      if (!example) return '';
      return example.correct === true || example.correct === 'True' ? 'example-status-correct' : 'example-status-wrong';
    }

    function renderAgentFilter(example) {
      const agentNames = unique((example?.agents || []).map((agent) => agent.name));
      if (state.agent !== 'all' && !agentNames.includes(state.agent)) state.agent = 'all';
      return `<div class="field"><label for="agentFilter">Subagent</label><select id="agentFilter" onchange="setAgentFilter(this.value)"><option value="all">All subagents</option>${agentNames.map((name) => `<option value="${esc(name)}" ${state.agent === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select></div>`;
    }

    function renderEventAgentFilter(example) {
      const eventNames = (example?.events || []).flatMap((event) => [event.source, event.target === 'broadcast' ? '' : event.target]);
      const receiptNames = (example?.receipts || []).flatMap((receipt) => [receipt.agent_name, receipt.source]);
      const agentNames = unique([...(example?.agents || []).map((agent) => agent.name), ...eventNames, ...receiptNames]);
      if (state.eventAgent !== 'all' && !agentNames.includes(state.eventAgent)) state.eventAgent = 'all';
      return `<div class="field"><label for="eventAgentFilter">Event agent</label><select id="eventAgentFilter" onchange="setEventAgentFilter(this.value)"><option value="all">All event agents</option>${agentNames.map((name) => `<option value="${esc(name)}" ${state.eventAgent === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select></div>`;
    }

    function renderEventTypeFilter(example) {
      const eventTypes = unique([
        ...(example?.events || []).map((event) => event.event_type),
        ...(example?.receipts || []).map((receipt) => receipt.event_type),
      ]);
      if (state.eventType.startsWith('type:') && !eventTypes.includes(state.eventType.slice(5))) {
        state.eventType = 'communication';
      }
      return `
        <div class="field">
          <label for="eventTypeFilter">Event type</label>
          <select id="eventTypeFilter" onchange="setEventTypeFilter(this.value)">
            <option value="communication" ${state.eventType === 'communication' ? 'selected' : ''}>Communication only</option>
            <option value="lifecycle" ${state.eventType === 'lifecycle' ? 'selected' : ''}>Lifecycle only</option>
            <option value="agent_done" ${state.eventType === 'agent_done' ? 'selected' : ''}>Agent done only</option>
            <option value="message_received" ${state.eventType === 'message_received' ? 'selected' : ''}>Message receipts only</option>
            <option value="all" ${state.eventType === 'all' ? 'selected' : ''}>All event types</option>
            ${eventTypes.map((type) => `<option value="type:${esc(type)}" ${state.eventType === `type:${type}` ? 'selected' : ''}>${esc(type)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    function setAgentFilter(value) {
      state.agent = value;
      state.tab = 'Agents';
      render();
    }

    function setEventAgentFilter(value) {
      state.eventAgent = value;
      state.tab = 'Events';
      render();
    }

    function setEventTypeFilter(value) {
      state.eventType = value;
      state.tab = 'Events';
      render();
    }

    function renderTabs(example) {
      const tabs = ['Overview', 'Orchestrator', 'Prompt', 'Output', 'Agents', 'Summarizer', 'Events', 'Tools', 'Raw'];
      $('tabs').innerHTML = tabs.map((tab) => `<button class="tab ${state.tab === tab ? 'active' : ''}" type="button" data-tab="${tab}">${tab}</button>`).join('');
      document.querySelectorAll('[data-tab]').forEach((button) => {
        button.addEventListener('click', () => {
          state.tab = button.dataset.tab;
          renderTabs(example);
          renderTab(example);
        });
      });
    }

    function renderTab(example) {
      if (!example) {
        $('tabContent').innerHTML = '<div class="empty">This run has no JSON trace examples.</div>';
        return;
      }
      if (!example.trace_loaded) {
        if (example.trace_error) {
          $('tabContent').innerHTML = `
            <div class="empty">Could not load this trace: ${esc(example.trace_error)}</div>
            <details open><summary>Summary row</summary><pre>${esc(pretty(example.result || {}))}</pre></details>
          `;
          return;
        }
        scheduleExampleTraceLoad(example);
        $('tabContent').innerHTML = `
          <div class="empty">Loading trace ${esc(example.path || '')}...</div>
          <details open><summary>Summary row</summary><pre>${esc(pretty(example.result || {}))}</pre></details>
        `;
        return;
      }
      const renderers = { Overview: renderOverview, Orchestrator: renderOrchestrator, Prompt: renderPrompt, Output: renderOutput, Agents: renderAgents, Summarizer: renderSummarizer, Events: renderEvents, Tools: renderTools, Raw: renderRaw };
      $('tabContent').innerHTML = renderers[state.tab](example);
    }

    function renderOverview(example) {
      return `
        <div class="grid">
          <div>
            <h3>Result</h3>
            <p>
              <span class="pill">pred: ${esc(example.pred)}</span>
              <span class="pill">gold: ${esc(example.gold)}</span>
              <span class="pill ${example.correct ? 'good' : 'bad'}">correct: ${esc(example.correct)}</span>
            </p>
            ${example.error ? `<pre class="bad">${esc(example.error)}</pre>` : '<p class="subtle">No error recorded.</p>'}
          </div>
          <div>
            <h3>Agents</h3>
            ${(example.agents || []).map((agent) => `<span class="pill">${esc(agent.name)} · ${agent.steps.length} steps</span>`).join('') || '<p class="subtle">No agent traces.</p>'}
            <p>
              <span class="pill ${example.synthesizer_trace_present ? 'good' : 'warn'}">
                ${example.synthesizer_trace_present ? 'Summarizer trace present' : 'Summarizer trace missing'}
              </span>
              ${example.synthesizer_trace_present ? `<span class="pill">method_trace.synthesizer_trace</span><span class="pill">mode: ${esc(example.synthesizer_trace_mode)}</span><span class="pill">tokens: ${esc(formatTokenUsage(example.synthesizer_trace_token_usage))}</span>` : ''}
            </p>
          </div>
        </div>
        ${renderQuestionMatrix(currentRun())}
      `;
    }

    function renderPrompt(example) {
      return `<pre>${esc(example.prompt)}</pre>`;
    }

    function renderOrchestrator(example) {
      if (example.dynamic_orchestration) {
        return renderDynamicOrchestration(example.dynamic_orchestration);
      }
      const orchestrator = example.orchestrator || {};
      const rawSections = [
        orchestrator.prompt ? `<details><summary>Raw orchestrator prompt</summary><pre>${esc(orchestrator.prompt)}</pre></details>` : '',
        orchestrator.raw_output ? `<details open><summary>Raw orchestrator output</summary><pre>${esc(orchestrator.raw_output)}</pre></details>` : '<div class="empty">Raw orchestrator output is not present in this trace. Current runs save the validated orchestrator plan, reason, selected agents, and assignments.</div>',
      ].join('');
      return `
        <div class="grid">
          <div>
            <h3>Routing Decision</h3>
            <p>
              <span class="pill">mode: ${esc(orchestrator.plan?.mode)}</span>
              <span class="pill">subagent mode: ${esc(orchestrator.plan?.subagent_mode)}</span>
              <span class="pill">task type: ${esc(orchestrator.plan?.task_type)}</span>
            </p>
            <h4>Routing decision reason</h4>
            <pre>${esc(orchestrator.reason || orchestrator.plan?.reason || '')}</pre>
          </div>
          <div>
            <h3>Selected subagents</h3>
            ${(orchestrator.selected_agents || []).map((agent) => `
              <div class="mini-panel">
                <strong>${esc(agent.name || agent.agent_name)}</strong>
                ${agent.role ? `<div><strong>Role</strong><br>${esc(agent.role)}</div>` : ''}
                ${agent.description ? `<div><strong>Agent description</strong><br>${esc(agent.description)}</div>` : ''}
                <p>${esc(agent.subtask || agent.task || '')}</p>
                ${agent.expected_output ? `<div><strong>Expected output</strong><br>${esc(agent.expected_output)}</div>` : ''}
                ${Array.isArray(agent.rules) && agent.rules.length ? `<div><strong>Rules</strong><ul>${agent.rules.map((rule) => `<li>${esc(rule)}</li>`).join('')}</ul></div>` : ''}
              </div>
            `).join('') || '<p class="subtle">No selected agents recorded.</p>'}
          </div>
        </div>
        <details open><summary>Validated orchestrator plan</summary><pre>${esc(pretty(orchestrator.plan || {}))}</pre></details>
        <details><summary>Agent assignments</summary><pre>${esc(pretty(orchestrator.assignments || []))}</pre></details>
        ${rawSections}
      `;
    }

    function renderDynamicOrchestration(trace) {
      return `
        <div class="grid">
          <div>
            <h3>Dynamic Orchestration</h3>
            <p>
              <span class="pill">rounds: ${esc((trace.rounds || []).length)}</span>
              <span class="pill">max rounds: ${esc(trace.max_orchestrator_rounds ?? '')}</span>
              <span class="pill ${trace.forced_final ? 'warn' : 'good'}">forced final: ${esc(Boolean(trace.forced_final))}</span>
            </p>
          </div>
          <div>
            <h3>Final answer</h3>
            <pre>${esc(trace.final_answer || '')}</pre>
          </div>
        </div>
        ${renderDynamicOrchestrationPlan(trace)}
        ${renderDynamicOrchestrationPool(trace)}
        ${(trace.rounds || []).map((round) => renderDynamicOrchestrationRound(round)).join('') || '<div class="empty">No orchestration rounds recorded.</div>'}
      `;
    }

    function renderDynamicOrchestrationPool(trace) {
      const pool = Array.isArray(trace.subagent_pool) ? trace.subagent_pool : [];
      if (!pool.length) {
        return '<div class="empty">No fixed subagent_pool was recorded for this dynamic orchestration run.</div>';
      }
      return `
        <details class="mini-panel" open>
          <summary>Fixed subagent pool</summary>
          <div class="grid">
            ${pool.map((agent) => `
              <div class="mini-panel">
                <strong>${esc(agent.name || agent.agent_name || '')}</strong>
                ${agent.role ? `<div><strong>Role</strong><br>${esc(agent.role)}</div>` : ''}
                ${agent.description ? `<div><strong>Description</strong><br>${esc(agent.description)}</div>` : ''}
